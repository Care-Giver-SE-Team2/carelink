services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: carelink
      MYSQL_USER: carelink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    # Ping over TCP, not the socket: while MySQL initialises it runs a temporary
    # server that answers on the socket only, so a socket ping reports "healthy"
    # seconds before the real server accepts connections and the backend then
    # dies with "Communications link failure" (seen once in the pipeline).
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks: [carelink]

  backend:
    # Builds locally by default. In CI, CARELINK_IMAGE names the image the pipeline
    # already built, so every environment deploys the same artefact and nothing is
    # rebuilt at deployment time.
    image: ${CARELINK_IMAGE:-carelink:local}
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/carelink?connectionTimeZone=Asia/Singapore
      DB_USER: carelink
      DB_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [carelink]

# The network name is fixed so ZAP can join the same network by a known name
networks:
  carelink:
    name: carelink-net
