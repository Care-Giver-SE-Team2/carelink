# Isolated local demo: never reuse staging's project/network/volume.
name: carelink-caregiver-demo
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-demo-root
      MYSQL_DATABASE: carelink
      MYSQL_USER: carelink
      MYSQL_PASSWORD: local-demo-db
      TZ: Asia/Singapore
    command: ["--default-time-zone=+08:00"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - demo-db:/var/lib/mysql
  backend:
    image: carelink:caregiver-demo
    build:
      context: ../..
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/carelink?connectionTimeZone=Asia/Singapore
      DB_USER: carelink
      DB_PASSWORD: local-demo-db
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Singapore
    ports: ["127.0.0.1:8081:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  demo-db:
