name: carelink-credential-demo
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-credential-root
      MYSQL_DATABASE: carelink
      MYSQL_USER: carelink
      MYSQL_PASSWORD: local-credential-db
      TZ: Asia/Singapore
    command: ["--default-time-zone=+08:00"]
    volumes: [credential-demo-db:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    image: carelink:credential-demo
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db: {condition: service_healthy}
    environment:
      DB_URL: jdbc:mysql://db:3306/carelink?connectionTimeZone=Asia/Singapore
      DB_USER: carelink
      DB_PASSWORD: local-credential-db
      CARELINK_CREDENTIAL_STORAGE: /app/private/credentials
      CARELINK_MULTIPART_TEMP: /app/private/multipart
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Singapore
      APP_COMMIT: credential-upload-local-uncommitted
      CARELINK_CAREGIVER_EXPIRY_SCAN_CRON: "-"
    volumes:
      # Explicit project-local private files; separate from all old demos.
      - ../../reports/credential-demo/private:/app/private
    ports: ["127.0.0.1:8085:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  credential-demo-db:
