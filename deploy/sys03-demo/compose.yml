# Independent local data: never attach the legacy caregiver-demo or staging volume.
name: carelink-sys03-demo
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-sys03-root
      MYSQL_DATABASE: carelink
      MYSQL_USER: carelink
      MYSQL_PASSWORD: local-sys03-db
      TZ: Asia/Singapore
    command: ["--default-time-zone=+08:00"]
    volumes: ["sys03-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    image: carelink:sys03-demo
    build:
      context: ../..
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/carelink?connectionTimeZone=Asia/Singapore
      DB_USER: carelink
      DB_PASSWORD: local-sys03-db
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Singapore
      APP_COMMIT: ${SYS03_APP_COMMIT:-unknown}
      # LOCAL demonstration only. Production remains 10m / 60s.
      CARELINK_LATE_ARRIVAL_THRESHOLD: PT1M
      CARELINK_MISSED_CHECK_IN_SCAN_INTERVAL: PT5S
      CARELINK_MISSED_CHECK_IN_SCAN_INITIAL_DELAY: PT30S
    ports: ["127.0.0.1:8082:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  sys03-db:
