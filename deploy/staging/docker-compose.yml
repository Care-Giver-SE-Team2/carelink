# CareLink staging stack, as installed on the staging VM at /opt/carelink.
#
# This is deliberately not the repository's root docker-compose.yml, which serves
# local development and the pipeline's own checks. Differences:
#   - never builds; it only runs the image the pipeline published to GHCR
#   - MySQL data lives in a named volume, so it survives restarts and image updates
#   - the application is published on port 80
#   - both services come back with the machine
#
# Secrets come from /opt/carelink/.env, written once by install.sh and never
# committed. The image tag is moved by the pipeline; carelink-update.timer notices
# and rolls the backend.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in /opt/carelink/.env}
      MYSQL_DATABASE: carelink
      MYSQL_USER: carelink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in /opt/carelink/.env}
    volumes:
      - db-data:/var/lib/mysql
    # Ping over TCP, not the socket: while MySQL initialises it runs a temporary
    # server that answers on the socket only, so a socket ping reports "healthy"
    # seconds before the real server accepts connections and the backend then
    # dies with "Communications link failure" (seen once in the pipeline).
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks: [carelink]

  backend:
    image: ${CARELINK_IMAGE:?set in /opt/carelink/.env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/carelink?connectionTimeZone=Asia/Singapore
      DB_USER: carelink
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # A 2 GB machine shared with MySQL: cap the JVM heap at half of what the
      # container sees, otherwise the two fight and the kernel kills one of them.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 30
    networks: [carelink]

volumes:
  db-data:

networks:
  carelink:
    name: carelink-net
