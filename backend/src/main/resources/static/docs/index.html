<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>CareLink API Docs</title>
	<!-- Version must match the org.webjars:swagger-ui dependency in pom.xml. -->
	<link rel="stylesheet" href="/webjars/swagger-ui/5.27.0/swagger-ui.css">
</head>
<body>
	<div id="swagger-ui"></div>
	<script src="/webjars/swagger-ui/5.27.0/swagger-ui-bundle.js"></script>
	<script src="/webjars/swagger-ui/5.27.0/swagger-ui-standalone-preset.js"></script>
	<script>
		window.onload = () => {
			window.ui = SwaggerUIBundle({
				urls: [
					{ url: '/openapi.yaml', name: 'Final' },
					{ url: '/openapi-draft.yaml', name: 'Draft' }
				],
				"urls.primaryName": 'Final',
				dom_id: '#swagger-ui',
				presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
				layout: 'StandaloneLayout'
			});
		};
	</script>
</body>
</html>
