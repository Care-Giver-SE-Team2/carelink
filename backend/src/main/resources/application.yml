spring:
  application:
    name: carelink
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/carelink?connectionTimeZone=Asia/Singapore}
    username: ${DB_USER:carelink}
    password: ${DB_PASSWORD:carelink}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate validates it and never alters it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    sg.nus.carelink: INFO
