<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>CareLink API Docs</title>
	<!--
	  Standalone copy for GitHub Pages: pulls Swagger UI from a CDN instead of the
	  backend's webjar, and loads openapi.yaml relatively so it works at whatever
	  subpath Pages serves this repo from. Kept in sync by hand with
	  backend/src/main/resources/static/docs/index.html, which serves the same
	  spec off the live app. Version pinned to match the org.webjars:swagger-ui
	  dependency in backend/pom.xml.
	-->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.27.0/swagger-ui.css">
</head>
<body>
	<div id="swagger-ui"></div>
	<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.27.0/swagger-ui-bundle.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.27.0/swagger-ui-standalone-preset.js"></script>
	<script>
		window.onload = () => {
			window.ui = SwaggerUIBundle({
				url: './openapi.yaml',
				dom_id: '#swagger-ui',
				presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
				layout: 'StandaloneLayout'
			});
		};
	</script>
</body>
</html>
