      summary: Apply a standard response playbook
      x-status: draft
      description: 'UC-MG05 step 5 / 4a. When the family cannot be reached, or agrees to it, the manager confirms the standard
        playbook for the incident''s category and severity; the steps it prescribes are appended to the timeline as the manager
        carries them out. The playbook is chosen from `/incident-playbooks`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - playbookCode
              properties:
                playbookCode:
                  type: string
                  example: FALL_MEDIUM
      responses:
        '200':
          description: Playbook recorded on the incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /incidents/{id}/severity:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Incidents
      summary: Raise or lower the severity
      x-status: draft
      description: 'UC-MG05 5a. When the situation worsens the manager raises the severity; the escalation chain is re-assembled
        for the new severity and the countdown restarted, but the same incident and the same timeline continue — no new incident
        is opened.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - severity
              properties:
                severity:
                  $ref: '#/components/schemas/IncidentSeverity'
                reason:
                  type: string
      responses:
        '200':
          description: Severity changed; chain re-assembled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
  /incident-playbooks:
    get:
      tags:
      - Incidents
      summary: Standard response playbooks
      x-status: draft
      description: The organisation's standard responses per category and severity, as configured (not code constants).
      parameters:
      - name: category
        in: query
        schema:
          $ref: '#/components/schemas/IncidentCategory'
      - name: severity
        in: query
        schema:
          $ref: '#/components/schemas/IncidentSeverity'
      responses:
        '200':
          description: Matching playbooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentPlaybook'
  /incidents/{id}/resolve:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Incidents
      summary: Resolve the incident
      x-status: draft
      description: 'UC-MG05 step 6. Only the current responder may resolve. An incident is never closed automatically: without
        this call it stays open and keeps escalating.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - resolutionNote
              properties:
                resolutionNote:
                  type: string
                outcome:
                  type: string
                  enum:
                  - HANDLED_ON_SITE
                  - REFERRED_TO_MEDICAL_CARE
                  - FALSE_ALARM
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '403':
          description: The caller is not the current responder.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Already resolved.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /incidents/{id}/acknowledge:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Incidents
      summary: Acknowledge an urgent alert
      x-status: draft
      description: UC-FM05. Family acknowledging stops that recipient's countdown; it does not resolve the incident itself.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                responseNote:
                  type: string
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentAcknowledgement'
  /spot-checks:
    get:
      tags:
      - Spot checks
      summary: List spot checks
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: approvalStatus
        in: query
        schema:
          type: string
          enum:
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
      responses:
        '200':
          description: Page of spot checks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpotCheck'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
    post:
      tags:
      - Spot checks
      summary: Schedule a home service spot check
      x-status: draft
      description: UC-MG08. Created `PENDING_APPROVAL`; the family must approve it before it proceeds (UC-FM07).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotCheckCreateRequest'
      responses:
        '201':
          description: Spot check scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheck'
  /spot-checks/{id}/family-approval:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Spot checks
      summary: Approve or reject a spot check
      x-status: draft
      description: UC-MG08 step 3 / 3a (the former UC-FM07). A check never proceeds without the family's consent; a rejection
        needs a reason and closes the request with no record against anyone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVED
                  - REJECTED
                reason:
                  type: string
                  description: Required when rejecting.
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheck'
  /spot-checks/{id}/complete:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Spot checks
      summary: Record spot-check findings
      x-status: draft
      description: 'UC-MG08 step 4, from the manager''s phone on site. `SATISFACTORY` or `NEEDS_IMPROVEMENT` is written to
        the caregiver''s record, visible to the caregiver and the family, and feeds rostering as a reference (never as a penalty
        on its own). `CAREGIVER_ABSENT` (4a) converts the check into a missed-visit incident handled through UC-MG05 and closes
        the check; `ELDER_NOT_HOME` (4b) closes the check without any record against the caregiver.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotCheckCompleteRequest'
      responses:
        '200':
          description: Findings recorded; `incidentId` set when an incident was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheck'
        '409':
          description: The check is not in an approved, open state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /spot-checks/{id}/withdraw:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Spot checks
      summary: Withdraw a spot check
      x-status: draft
      description: UC-MG08 4b / failure path. Closes the request with the manager's reason; no visit record is produced and
        the care plan is untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheck'
  /spot-checks/{id}/reschedule:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Spot checks
      summary: Propose a new time for a spot check
      x-status: draft
      description: 'UC-MG08 4b. The check goes back to `PENDING_APPROVAL` — a new time needs the family''s consent again.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - proposedTime
              properties:
                proposedTime:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Re-proposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheck'
  /spot-checks/{id}/caregiver-response:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Spot checks
      summary: Caregiver responds to the findings
      x-status: draft
      description: The finding is visible to the caregiver (unlike elder ratings) and they may answer it once; the response
        sits next to the finding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - response
              properties:
                response:
                  type: string
      responses:
        '200':
          description: Response recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCheck'
  /reports/generate:
    post:
      tags:
      - Reports
      summary: Generate periodic reports
      x-status: draft
      description: 'UC-MG07. Run by the scheduler at the end of each period and by a manager on demand. One period of records
        becomes three audience-filtered artefacts in a single run — `FAMILY`, `REGULATOR` and `INTERNAL` share a skeleton
        but not a filtering rule. Unclosed visits in the period do not block generation: the report is marked `dataComplete:
        false` and lists the missing items (2a). If the language-model summary is unavailable the family version falls back
        to the structured template (3a), reported via `generatedBy`. Omit `elderId` to generate for every elder, which is
        what the scheduler does. The `FAMILY` filter is specified precisely (per the supervisor side''s screen-2c mock): scoped
        to elders the requesting family member is actively bound to; caregiver identity reduced to name only, no staff-performance
        data; vital-sign readings given as ranges, not raw values; other elders'' records excluded entirely; a medical disclaimer
        is always present. The `REGULATOR` and `INTERNAL` filters are not yet specified and are pending their owners.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - periodStart
              - periodEnd
              properties:
                elderId:
                  type: integer
                  format: int64
                  description: One elder; omit for all elders with records in the period.
                periodStart:
                  type: string
                  format: date
                periodEnd:
                  type: string
                  format: date
      responses:
        '202':
          description: One report per audience (per elder) generated and archived.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
  /reports:
    get:
      tags:
      - Reports
      summary: List generated reports
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: elderId
        in: query
        schema:
          type: integer
          format: int64
      - name: audience
        in: query
        schema:
          $ref: '#/components/schemas/ReportAudience'
      responses:
        '200':
          description: Page of reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
  /reports/{id}/export:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Reports
      summary: Export a report
      x-status: draft
      responses:
        '200':
          description: Rendered file.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '503':
          description: Rendering failed; the report is still readable at `/reports/{id}` and the export can be retried (5b).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /reports/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Reports
      summary: Read a report online
      x-status: draft
      description: 'The report''s sections, already filtered for its audience. Readable even when PDF export fails (5b). A
        family member can only read `FAMILY` reports of elders they are bound to. There is deliberately no DELETE and no PUT
        on a report: an archived report cannot be removed or edited in place (5a); corrections are appended as amendments.

        '
      responses:
        '200':
          description: Report with its sections and amendments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetail'
        '403':
          description: Not the reader's audience.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{id}/amendments:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Reports
      summary: Append a correction to an archived report
      x-status: draft
      description: 'UC-MG07 business rule: an archived report is immutable, so a correction is a dated, signed note appended
        to it — the original text stays as it was generated.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - note
              properties:
                note:
                  type: string
      responses:
        '201':
          description: Amendment appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAmendment'
  /elders/{elderId}/weekly-summary:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    get:
      tags:
      - Reports
      summary: Plain-language weekly summary
      x-status: draft
      description: 'UC-FM04. Language-model output over the week''s structured records, with a rule-based (template) fallback
        when the model is unavailable. Never carries clinical judgement — `disclaimer` is fixed text on every response.

        '
      responses:
        '200':
          description: Weekly summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySummary'
  /value-added-services:
    get:
      tags:
      - Value-added services
      summary: List the service catalogue
      x-status: draft
      responses:
        '200':
          description: Available services.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValueAddedService'
  /value-added-service-requests:
    get:
      tags:
      - Value-added services
      summary: List value-added service requests
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: elderId
        in: query
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ValueAddedServiceRequestStatus'
      responses:
        '200':
          description: Page of requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValueAddedServiceRequest'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
    post:
      tags:
      - Value-added services
      summary: Request a value-added service
      x-status: draft
      description: 'UC-EL02. Elder-initiated by default; `requestedByFamilyId` is set when a family member requests on the
        elder''s behalf instead. Records intent only — no price, no payment.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValueAddedServiceRequestCreate'
      responses:
        '201':
          description: Request created, `PENDING_APPROVAL`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueAddedServiceRequest'
  /value-added-service-requests/{id}/decision:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Value-added services
      summary: Approve or decline a service request
      x-status: draft
      description: UC-FM08. Approval generates a work order (`DISPATCHED`); no money moves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVED
                  - REJECTED
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueAddedServiceRequest'
  /elders/{elderId}/emergency-calls:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    post:
      tags:
      - Emergency
      summary: Trigger an emergency call for help
      x-status: draft
      description: 'UC-EL03. One large tap in the elder view. Skips the ordinary queue: opens a `severity: HIGH`, `category:
        SOS` incident and notifies bound family and the on-duty manager synchronously, in the same request — not on the next
        scheduled scan.

        '
      responses:
        '201':
          description: Emergency call raised as a critical incident.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyCallCreateRequest'
  /emergency-calls/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Emergency
      summary: Get the status of a triggered emergency call
      x-status: draft
      description: An alias over the resulting incident, kept as its own path so the elder/family UI doesn't need to know
        it's the same resource.
      responses:
        '200':
          description: Incident detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
  /notifications/me:
    get:
      tags:
      - Notifications
      summary: My notification inbox
      x-status: draft
      description: In-application and email only; there is no push infrastructure, so this is a pull inbox.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - SENT
          - READ
          - FAILED
      responses:
        '200':
          description: Page of notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
  /notifications/{id}/read:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Notifications
      summary: Mark a notification read
      x-status: draft
      responses:
        '200':
          description: Marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
  /family-bindings/{bindingId}/decision:
    parameters:
    - name: bindingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Elders
      summary: Confirm or reject a proposed family binding
      x-status: draft
      description: The party that did not initiate the binding decides whether to accept or reject it. CONFIRM moves the binding
        to ACTIVE; REJECT moves it to REJECTED.
      responses:
        '200':
          description: Binding active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElderFamilyBinding'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyBindingDecisionRequest'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 'Server-side session established by `POST /auth/login`. State-changing requests must also echo the `XSRF-TOKEN`
        cookie value in an `X-XSRF-TOKEN` header.

        '
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    ElderId:
      name: elderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CaregiverId:
      name: caregiverId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
    CurrentUserResponse:
      type: object
      required:
      - id
      - username
      - displayName
      - roles
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
          description: Sorted, upper-case role names, e.g. `ELDER`, `FAMILY`, `MANAGER`.
    ProblemDetail:
      description: RFC 9457 `application/problem+json` body. Every error response uses this shape.
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
      additionalProperties: true
    Gender:
      type: string
      enum:
      - MALE
      - FEMALE
      - OTHER
    MobilityLevel:
      type: string
      enum:
      - INDEPENDENT
      - ASSISTIVE_CANE
      - WHEELCHAIR_BEDBOUND
    ContinuityPreference:
      type: string
      enum:
      - PREFERRED
      - REQUIRED
      - NONE
    Elder:
      type: object
      required:
      - id
      - fullName
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
        address:
          type: string
        postalCode:
          type: string
        sector:
          type: string
          description: Locality band used when matching caregivers.
        preferredDialects:
          type: array
          items:
            type: string
        livesAlone:
          type: boolean
        mobilityLevel:
          $ref: '#/components/schemas/MobilityLevel'
        continuityPreference:
          $ref: '#/components/schemas/ContinuityPreference'
        medicalNotes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ElderPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Elder'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    ElderCreateRequest:
      type: object
      required:
      - fullName
      properties:
        fullName:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
        address:
