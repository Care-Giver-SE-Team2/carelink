        reportId: 410
        elderId: 12
        periodStart: '2026-09-07'
        periodEnd: '2026-09-13'
        summaryText: Three planned visits were completed this week.
        generatedBy: TEMPLATE
        disclaimer: This summary records care observations and services; it is not a diagnosis or medical advice.
