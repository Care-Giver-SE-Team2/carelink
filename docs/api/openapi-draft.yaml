      operationId: markNotificationRead
      description: >-
        For FAMILY, mark only a displayable IN_APP notification addressed to the current user as READ. Require
        current authorisation for any linked care content. Set readAt only on its first successful read;
        repeated/concurrent reads return 200 and preserve that timestamp. Non-displayable notifications are not
        readable through the family inbox operation. No business request body is accepted. Reading the
        notification does not record viewedAt, acknowledge an incident, stop its recipient response window or
        change incident status. Other account roles retain their existing notification read behaviour.


        Family callers are identified from the authenticated session, never a caller-supplied familyMemberId. For
        family callers, care resources require an ACTIVE binding to their actual elder, with no revocation and no
        elapsed expiresAt, and the applicable access scope at request time. Revocation/expiry takes effect on
        subsequent reads and writes, including historical content. Reading a family care resource records the
        caller, resource and server access time in the internal audit trail. Read access alone does not imply
        explicit acknowledgement. FULL/READ_ONLY do not imply different clinical field sets: both may use the
        family read projections below; an authorised notification recipient may record read/view/acknowledgement
        under either scope because those commands record the recipient response, not a change to the elder care
        record.


        State-changing calls require the existing session cookie and the current XSRF-TOKEN cookie value in the
        X-XSRF-TOKEN header. Missing/invalid CSRF protection is 403. No caller-supplied user ID or timestamp is
        accepted.
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Echo the current XSRF-TOKEN cookie; use the platform session/CSRF bootstrap flow.
        schema:
          type: string
          minLength: 1
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyNotification'
  /family-bindings/{bindingId}/decision:
    parameters:
    - name: bindingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Elders
      summary: Confirm or reject a proposed family binding
      x-status: draft
      description: The party that did not initiate the binding decides whether to accept or reject it. CONFIRM moves the binding
        to ACTIVE; REJECT moves it to REJECTED.
      responses:
        '200':
          description: Binding active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElderFamilyBinding'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyBindingDecisionRequest'
  /incidents/{id}/view:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    post:
      tags:
      - Incidents
      responses:
        '200':
          description: Successful family operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyIncidentAcknowledgement'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
        '404':
          $ref: '#/components/responses/FamilyNotFound'
      x-status: draft
      x-contract-status: specified
      x-use-cases:
      - UC-FM05
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
      - sessionCookie: []
      operationId: familyPostIncidentsIdView
      description: >-
        For FAMILY, authorise access using the authenticated family identity, an ACTIVE and unexpired binding to
        the actual incident elder, and the applicable access scope. Derive the current familyMemberId from the
        session; the caller cannot choose another family member. The existence, delivery success or read state
        of a notification is not an authorisation condition. An otherwise authorised family member may read the
        incident and record their own view or acknowledgement even if no IN_APP notification exists or
        notification creation/delivery failed. Urgent alerts cannot be disabled through optional subscription
        preferences; that rule never overrides binding/access checks. The response window starts with the first
        successful urgent IN_APP notification creation for this incident/recipient and uses the configured
        interval (default two hours); further notices, polling and email retries do not reset it. GET
        /incidents/{id} returns acknowledgeBy, which is null when no response window has been established. A
        missing or failed notification does not block reading, viewing or acknowledging the incident. Later
        notification creation must preserve any already-recorded acknowledgement and must not restart waiting
        reminders for that family member. This recipient window is independent of manager incident status,
        respondBy and escalation. FAMILY-only explicit display receipt, called after the page successfully
        displays authorised incident detail. It accepts no business request body. Create or update only this
        incident/family pair, setting viewedAt to the first server receipt time if absent. Repeated/concurrent
        calls return 200 with the same first viewedAt. It does not mark a notification read, set acknowledgedAt,
        stop a response window or change incident handling. Late views and views after incident resolution may
        still be recorded while authorisation remains valid. The receipt records a display acknowledgement, not
        proof that the human understood the content.


        Family callers are identified from the authenticated session, never a caller-supplied familyMemberId.
        For family callers, care resources require an ACTIVE binding to their actual elder, with no revocation
        and no elapsed expiresAt, and the applicable access scope at request time. Revocation/expiry takes
        effect on subsequent reads and writes, including historical content. Reading a family care resource
        records the caller, resource and server access time in the internal audit trail. Read access alone does
        not imply explicit acknowledgement. FULL/READ_ONLY do not imply different clinical field sets: both may
        use the family read projections below; an authorised family member may record their own incident
        view/acknowledgement under either scope because those commands record that family member's response, not
        a change to the elder care record. Notification read commands separately require ownership of the
        notification; no notification record is required for these incident operations.


        State-changing calls require the existing session cookie and the current XSRF-TOKEN cookie value in the
        X-XSRF-TOKEN header. Missing/invalid CSRF protection is 403. No caller-supplied user ID or timestamp is
        accepted.
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Echo the current XSRF-TOKEN cookie; use the platform session/CSRF bootstrap flow.
        schema:
          type: string
          minLength: 1
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIncidentAcknowledgement'
      summary: Record the current family member viewing an incident
