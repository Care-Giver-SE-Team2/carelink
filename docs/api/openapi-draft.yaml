openapi: 3.0.3
info:
  title: CareLink API
  description: 'This is a spec-first (design-first) API contract: it is hand-written and

    reviewed before the corresponding backend endpoint is implemented. It is

    the source of truth for the HTTP contract — controllers must match it,

    not the other way around.


    Only the `Auth` group is backed by a running controller today. Every

    other group is a draft: agreed enough to shape the frontend and the

    schema, but not yet implemented, and open to change as each feature

    module is actually built. Draft operations carry `x-status: draft` in

    this file; implemented ones carry `x-status: implemented`.

    '
  version: 0.0.1
  license:
    name: UNLICENSED
servers:
- url: /api
  description: Same-origin, relative to whichever host serves the front end.
tags:
- name: Auth
  description: Session-based sign-in and identity.
- name: Elders
  description: Elder profiles and the family bindings that link them to family accounts.
- name: Family members
  description: 'A family member is an independent account holder, not an attribute of one elder — the relationship to an elder
    lives entirely in the family binding, so one family member can look after more than one elder.

    '
- name: Care plans
  description: 'The care plan tree (UC-MG01). A plan is versioned; a node is either a TASK or a SUB_PLAN, and a SUB_PLAN''s
    effort is the rolled-up sum of its children, to any depth.

    '
- name: Intake
  description: Family-submitted applications that, once approved, provision an elder profile (UC-FM01).
- name: Caregivers
  description: Caregiver accounts, certifications and self-service schedule (UC-MG02, UC-MG06, UC-CG01).
- name: Leave
  description: Absence reporting and the re-rostering it triggers (UC-CG02, UC-MG04).
- name: Rostering
  description: 'Composing a roster (UC-MG03). The objective is a Strategy chosen per run; the run keeps every candidate considered,
    not only the outcome, so "why wasn''t this caregiver suggested" is answerable after the fact.

    '
- name: Visits
  description: 'Executing and closing a visit (UC-CG03, UC-CG05). Legal transitions and required evidence both depend on the
    visit''s service type; illegal transitions are refused and recorded, never silently dropped.

    '
- name: Incidents
  description: 'Care exceptions (UC-CG04, UC-MG05, UC-FM05). The escalation chain is assembled at the moment it''s needed
    from severity, time of day and who is on duty — there is no fixed chain to configure.

    '
- name: Spot checks
  description: Manager-initiated home service spot checks and the family's approval of them (UC-MG08, UC-FM07).
- name: Reports
  description: Periodic, audience-filtered reports and the family's weekly plain-language summary (UC-MG07, UC-FM04).
- name: Value-added services
  description: Non-billable service requests — intent and a work order only, never a charge (UC-EL02, UC-FM08).
- name: Reviews
  description: Family ratings of a caregiver and the renewal decision that follows (UC-FM09).
- name: Emergency
  description: The elder's one-tap SOS (UC-EL03) — bypasses the ordinary incident queue entirely.
- name: Notifications
  description: In-application and email notifications (no push infrastructure is in scope).
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in
      x-status: implemented
      description: 'Starts a server-side session on success. The session is carried by an HttpOnly `JSESSIONID` cookie set
        on the response; the front end does not read or manage it directly.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie (`JSESSIONID`) and CSRF cookie (`XSRF-TOKEN`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 'Invalid username or password. The two cases are not distinguished, so this response cannot be used
            to enumerate accounts.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Sign out
      x-status: implemented
      description: Ends the current session and clears the `JSESSIONID` cookie.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Get the current user
      x-status: implemented
      description: 'Returns the identity of the caller associated with the current session. The front end uses `roles` to
        decide which screens to show.

        '
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /elders:
    get:
      tags:
      - Elders
      summary: List elders
      x-status: draft
      description: 'Manager sees every elder. Family sees only the elders they are actively bound to; this is enforced server-side,
        not by a client filter.

        '
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: sector
        in: query
        schema:
          type: string
      - name: search
        in: query
        description: Matches against name.
        schema:
          type: string
      responses:
        '200':
          description: Page of elders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Elders
      summary: Establish elder profile and care plan
      x-status: draft
      description: 'UC-MG01. Establishes the elder profile. Usually called after an intake application is approved, rather
        than directly.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElderCreateRequest'
      responses:
        '201':
          description: Elder created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /elders/{elderId}:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    get:
      tags:
      - Elders
      summary: Get an elder profile
      x-status: draft
      responses:
        '200':
          description: Elder detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Elders
      summary: Update an elder profile
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElderUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /elders/{elderId}/care-plan:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    get:
      tags:
      - Care plans
      summary: Get the current care plan
      x-status: draft
      description: 'Returns the published plan as a node tree. `weeklyHours` on a SUB_PLAN node is computed server-side as
        the sum of its subtree, the same way it is for a single TASK node — a whole sub-plan must count toward the effort
        total the same way a single task does.

        '
      responses:
        '200':
          description: Care plan with its node tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarePlan'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Care plans
      summary: Replace the care plan
      x-status: draft
      description: 'Publishes a new version of the plan. The previous PUBLISHED version is marked SUPERSEDED and kept, never
        edited in place — a visit already in flight points at the version that was in force when it was created (see `Visit.carePlanId`).

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarePlanReplaceRequest'
      responses:
        '200':
          description: New plan version published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarePlan'
        '400':
          $ref: '#/components/responses/ValidationError'
  /elders/{elderId}/care-plan/nodes/{nodeId}/children:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    - name: nodeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Care plans
      summary: Add a task or sub-plan node
      x-status: draft
      description: Adds one child under an existing node, at any depth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarePlanNodeCreateRequest'
      responses:
        '201':
          description: Node added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarePlanNode'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /elders/{elderId}/care-plan/nodes/{nodeId}:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    - name: nodeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    delete:
      tags:
      - Care plans
      summary: Remove a node and its subtree
      x-status: draft
      responses:
        '204':
          description: Node (and any descendants) removed.
        '404':
          $ref: '#/components/responses/NotFound'
  /elders/{elderId}/family-bindings:
    parameters:
    - $ref: '#/components/parameters/ElderId'
    get:
      tags:
      - Elders
      summary: List family bindings for an elder
      x-status: draft
      responses:
        '200':
          description: Bindings, including pending ones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElderFamilyBinding'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BindingStatus'
    post:
      tags:
      - Elders
      summary: Propose a family binding
      x-status: draft
      description: 'UC-FM10, UC-EL04. Either the elder or a family member can initiate; the binding sits `PENDING_CONFIRMATION`
        until the other party confirms it via `POST /family-bindings/{bindingId}/confirm`. The elder side issues a six-digit
        pairing code out of band for the family member to enter.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyBindingCreateRequest'
      responses:
        '201':
          description: Binding proposed, awaiting confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElderFamilyBinding'
        '400':
          $ref: '#/components/responses/ValidationError'
  /family-bindings/{bindingId}/confirm:
    parameters:
    - name: bindingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Elders
      summary: Confirm a proposed family binding
      x-status: draft
      description: The party that did not initiate confirms; the binding becomes ACTIVE.
      responses:
        '200':
          description: Binding active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElderFamilyBinding'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /family-bindings/{bindingId}:
    parameters:
    - name: bindingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    delete:
      tags:
      - Elders
      summary: Revoke a family binding
      x-status: draft
      responses:
        '204':
          description: Binding revoked.
        '404':
          $ref: '#/components/responses/NotFound'
  /family-members/me:
    get:
      tags:
      - Family members
      summary: Get my family member profile
      x-status: draft
      description: 'The caller''s own profile. A family member is a standalone account holder — this endpoint has no elder-scoped
        variant, since which elders a family member sees is entirely a matter of their bindings (`GET /elders`), not of this
        profile.

        '
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Family members
      summary: Update my family member profile
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyMemberUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMember'
        '400':
          $ref: '#/components/responses/ValidationError'
  /intake-applications:
    get:
      tags:
      - Intake
      summary: List intake applications
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/IntakeStatus'
      responses:
        '200':
          description: Page of applications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntakeApplication'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
    post:
      tags:
      - Intake
      summary: Submit an intake application
      x-status: draft
      description: UC-FM01. Submitted by a family member on behalf of a prospective elder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeApplicationCreateRequest'
      responses:
        '201':
          description: Application submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeApplication'
        '400':
          $ref: '#/components/responses/ValidationError'
  /intake-applications/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Intake
      summary: Get an intake application
      x-status: draft
      responses:
        '200':
          description: Application detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeApplication'
        '404':
          $ref: '#/components/responses/NotFound'
  /intake-applications/{id}/decision:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Intake
      summary: Approve or reject an intake application
      x-status: draft
      description: Approving provisions the elder profile via `POST /elders` internally and returns its id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - APPROVED
                  - REJECTED
                remarks:
                  type: string
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeApplication'
        '409':
          $ref: '#/components/responses/Conflict'
  /caregivers:
    get:
      tags:
      - Caregivers
      summary: List caregivers
      x-status: draft
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: sector
        in: query
        schema:
          type: string
      - name: dialect
        in: query
        schema:
          type: string
      - name: credentialTypeId
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Page of caregivers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Caregiver'
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
    post:
      tags:
      - Caregivers
      summary: Assign caregiver account
      x-status: draft
      description: UC-MG02. Creates the caregiver profile; certifications are attached separately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverCreateRequest'
      responses:
        '201':
          description: Caregiver created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caregiver'
        '400':
          $ref: '#/components/responses/ValidationError'
  /caregivers/{caregiverId}:
    parameters:
    - $ref: '#/components/parameters/CaregiverId'
    get:
      tags:
      - Caregivers
      summary: Get a caregiver profile
      x-status: draft
      responses:
        '200':
          description: Caregiver detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caregiver'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Caregivers
      summary: Update a caregiver profile
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caregiver'
  /caregivers/{caregiverId}/credentials:
    parameters:
    - $ref: '#/components/parameters/CaregiverId'
    get:
      tags:
      - Caregivers
      summary: List a caregiver's certifications
      x-status: draft
      responses:
        '200':
          description: Certifications, including unpublished ones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
    post:
      tags:
      - Caregivers
      summary: Attach a certification
      x-status: draft
      description: UC-MG02. Created `SUBMITTED`; does not count toward rostering eligibility until published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreateRequest'
      responses:
        '201':
          description: Credential attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
  /caregivers/{caregiverId}/credentials/{credentialId}:
    parameters:
    - $ref: '#/components/parameters/CaregiverId'
    - name: credentialId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    patch:
      tags:
      - Caregivers
      summary: Update certification evidence or expiry
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
  /caregivers/{caregiverId}/credentials/{credentialId}/publish:
    parameters:
    - $ref: '#/components/parameters/CaregiverId'
    - name: credentialId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    post:
      tags:
      - Caregivers
      summary: Review and publish a certification
      x-status: draft
      description: 'UC-MG06. Moves a reviewed credential to `PUBLISHED`, the only status that counts as a PASS against `care_plan_required_credential`
        and the `CERTIFICATION_VALID` rostering constraint.

        '
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '409':
          $ref: '#/components/responses/Conflict'
  /caregivers/me/schedule:
    get:
      tags:
      - Caregivers
      summary: My schedule and certification alerts
      x-status: draft
      description: 'UC-CG01. The caller''s own upcoming visits, plus certifications whose `expiryDate` falls inside the configurable
        warning window (30 days by default).

        '
      responses:
        '200':
          description: Schedule and alerts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  upcomingVisits:
                    type: array
                    items:
                      $ref: '#/components/schemas/Visit'
                  certificationAlerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Credential'
  /caregivers/me:
    get:
      tags:
      - Caregivers
      summary: Get my caregiver profile
      x-status: draft
      description: 'Returns the profile of the authenticated caregiver. This self-service route avoids exposing a caller-selectable
        caregiver identifier.

        '
      responses:
        '200':
          description: The caller's caregiver profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caregiver'
    patch:
      tags:
      - Caregivers
      summary: Update my caregiver contact details
      x-status: draft
      description: 'Caregivers may update their own contact details only. Employment status remains manager-controlled.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverSelfUpdateRequest'
      responses:
        '200':
          description: Updated caregiver profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caregiver'
  /caregivers/me/preferences:
    get:
      tags:
      - Caregivers
      summary: Get my work preferences
      x-status: draft
      description: 'UC-CG02. Preferences are roster-planning input only; they never override an active credential requirement
        or approved absence.

        '
      responses:
        '200':
          description: The caller's current work preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverPreference'
    put:
      tags:
      - Caregivers
      summary: Replace my work preferences
      x-status: draft
      description: 'UC-CG02. Replaces the caregiver''s soft preferences used by roster planning. It does not change any roster
        assignment directly.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverPreferenceUpdateRequest'
      responses:
        '200':
          description: Work preferences saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverPreference'
  /caregivers/me/availability:
    get:
      tags:
      - Caregivers
      summary: List my daily availability
      x-status: draft
      description: 'UC-CG02. Returns the caller''s daily availability windows. Approved leave is considered separately by
        roster planning and is not editable through this route.

        '
      parameters:
      - name: dateFrom
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Availability records in the requested date range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaregiverAvailability'
  /caregivers/me/availability/{availableDate}:
    parameters:
    - name: availableDate
      in: path
      required: true
      schema:
        type: string
        format: date
    put:
      tags:
      - Caregivers
      summary: Set my availability for one day
      x-status: draft
      description: 'UC-CG02. Creates or replaces one daily availability window. The selected window remains subject to manager
        roster decisions and hard constraints.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaregiverAvailabilityUpsertRequest'
      responses:
        '200':
          description: Availability record saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverAvailability'
  /caregivers/{caregiverId}/reviews:
    parameters:
    - $ref: '#/components/parameters/CaregiverId'
    get:
      tags:
      - Reviews
      summary: List reviews for a caregiver
      x-status: draft
      responses:
        '200':
          description: Review history.
          content:
            application/json:
              schema:
                type: array
                items:
