openapi: 3.0.3

info:
  title: CareLink API
  version: 0.0.1
  description: >-
    Includes the existing Auth contract and the specified FM01-FM05 family contracts. Family
    operations remain x-status: draft until implemented; inclusion in Final does not imply a working
    backend. Shared paths retain their non-family response alternatives. The family owner supplies
    only the family use-case behaviour; other use cases, binding management and platform
    implementation are outside this change.
  license:
    name: UNLICENSED

servers:
  - url: /api
    description: Same-origin, relative to whichever host serves the front end.

tags:
  - name: Auth
    description: Session-based sign-in and identity.

  - name: Intake
    description: Intake applications and application progress, scoped to the current role.
  - name: Caregivers
    description: Caregiver profiles and credentials, scoped to the current role.
  - name: Visits
    description: Visit schedules, status, tasks and service timelines, scoped to the current role.
  - name: Incidents
    description: Incident details, view receipts and acknowledgement, with access defined per operation.
  - name: Reports
    description: Reports, weekly summaries and optional PDF export, scoped to the current role.
  - name: Notifications
    description: The current user's notification inbox and notification read state.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: >
        Starts a server-side session on success. The session is carried by an
        HttpOnly `JSESSIONID` cookie set on the response; the front end does
        not read or manage it directly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie (`JSESSIONID`) and CSRF cookie (`XSRF-TOKEN`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: >
            Invalid username or password. The two cases are not distinguished,
            so this response cannot be used to enumerate accounts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # Member 4: FM01-FM05 contract definitions, not implemented endpoints.
  /intake-applications:
    post:
      tags:
        - Intake
      summary: Submit an intake application
      x-status: draft
      description: >-
        Submit an intake application as the current family member. Trim required text and reject
        blanks. Omitted mobilityLevel uses INDEPENDENT. Success creates only the application in
        SUBMITTED and returns 201; it does not create an elder, care plan or binding. Approval belongs
        to MG01. The initial contract does not promise request-level idempotency: after an ambiguous
        network failure, query the caller's applications before explicitly resubmitting rather than
        automatically retrying the POST.


        Family identity is resolved from the session. No existing elder or active binding is required
        to submit or read the caller's own intake application. Family reads/writes are restricted to
        that applicant.


        State-changing calls require the existing session cookie and the current XSRF-TOKEN cookie
        value in the X-XSRF-TOKEN header. Missing/invalid CSRF protection is 403. No caller-supplied
        user ID or timestamp is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyIntakeApplicationCreateRequest'
      responses:
        '201':
          description: Successful family operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyIntakeApplication'
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
      x-contract-status: specified
      x-use-cases:
        - UC-FM01
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: familyPostIntakeApplications
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Echo the current XSRF-TOKEN cookie; use the platform session/CSRF bootstrap flow.
          schema:
            type: string
            minLength: 1
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIntakeApplication'
    get:
      tags:
        - Intake
      summary: List intake applications
      x-status: draft
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IntakeStatus'
      responses:
        '200':
          description: >-
            Family response uses the explicitly listed family schema. Other roles retain the original
            response schema; the server chooses by authenticated role, never by a client projection
            flag.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FamilyIntakeApplicationPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/IntakeApplication'
                      page:
                        type: integer
                      size:
                        type: integer
                      totalElements:
                        type: integer
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM01
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: listIntakeApplications
      description: >-
        Family callers see only applications they submitted, including review status and
        family-visible remarks. Order by createdAt descending, then id descending. Empty results are
        200 with items=[]. Managers retain the existing review-list behaviour. Pagination counts are
        computed after the role filter.


        Family identity is resolved from the session. No existing elder or active binding is required
        to submit or read the caller's own intake application. Family reads/writes are restricted to
        that applicant.
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIntakeApplicationPage'
  /intake-applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Intake
      summary: Get an intake application
      x-status: draft
      responses:
        '200':
          description: >-
            Family response uses the explicitly listed family schema. Other roles retain the original
            response schema; the server chooses by authenticated role, never by a client projection
            flag.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FamilyIntakeApplication'
                  - $ref: '#/components/schemas/IntakeApplication'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM01
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: getIntakeApplication
      description: >-
        Read the current family member's application and its review progress; another applicant's ID
        is 403. The response elderId is null until approval links a formal elder. An approved
        application is not an active binding. Managers retain their existing application-detail view.


        Family identity is resolved from the session. No existing elder or active binding is required
        to submit or read the caller's own intake application. Family reads/writes are restricted to
        that applicant.
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIntakeApplication'
  /caregivers/{caregiverId}:
    parameters:
      - $ref: '#/components/parameters/CaregiverId'
    get:
      tags:
        - Caregivers
      summary: Get a caregiver profile
      x-status: draft
      responses:
        '200':
          description: >-
            Family response uses the explicitly listed family schema. Other roles retain the original
            response schema; the server chooses by authenticated role, never by a client projection
            flag.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FamilyCaregiverView'
                  - $ref: '#/components/schemas/Caregiver'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM02
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: getCaregiver
      description: >-
        Family callers may read the public profile of a caregiver assigned to a visit of an elder they
        can currently access. Historical assigned visits also establish this relationship while the
        elder binding remains valid. An arbitrary unrelated caregiver ID is forbidden. Return the
        FamilyCaregiverView only; other roles retain their existing profile behaviour.


        Family callers are identified from the authenticated session, never a caller-supplied
        familyMemberId. For family callers, care resources require an ACTIVE binding to their actual
        elder, with no revocation and no elapsed expiresAt, and the applicable access scope at request
        time. Revocation/expiry takes effect on subsequent reads and writes, including historical
        content. Reading a family care resource records the caller, resource and server access time in
        the internal audit trail. Read access alone does not imply explicit acknowledgement.
        FULL/READ_ONLY do not imply different clinical field sets: both may use the family read
        projections below; an authorised notification recipient may record read/view/acknowledgement
        under either scope because those commands record the recipient response, not a change to the
        elder care record.
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyCaregiverView'
  /caregivers/{caregiverId}/credentials:
    parameters:
      - $ref: '#/components/parameters/CaregiverId'
    get:
      tags:
        - Caregivers
      summary: List a caregiver's certifications
      x-status: draft
      responses:
        '200':
          description: >-
            Family response uses the explicitly listed family schema. Other roles retain the original
            response schema; the server chooses by authenticated role, never by a client projection
            flag.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/FamilyCredentialView'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
        '404':
          $ref: '#/components/responses/FamilyNotFound'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM02
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: listCaregiverCredentials
      description: >-
        For FAMILY, require the same accessible-visit/caregiver relationship as the public profile.
        Return only credentials approved for public display, ordered by credentialTypeId then id.
        Exclude SUBMITTED/REJECTED material, certificate numbers and review metadata. A previously
        public credential may remain visible as EXPIRING, EXPIRED or REVOKED; never present an
        expired/revoked credential as valid. An existing accessible caregiver with no public
        credentials returns []. The original unfiltered credential array, including unpublished items,
        is reserved for authorised non-family roles.


        Family callers are identified from the authenticated session, never a caller-supplied
        familyMemberId. For family callers, care resources require an ACTIVE binding to their actual
        elder, with no revocation and no elapsed expiresAt, and the applicable access scope at request
        time. Revocation/expiry takes effect on subsequent reads and writes, including historical
        content. Reading a family care resource records the caller, resource and server access time in
        the internal audit trail. Read access alone does not imply explicit acknowledgement.
        FULL/READ_ONLY do not imply different clinical field sets: both may use the family read
        projections below; an authorised notification recipient may record read/view/acknowledgement
        under either scope because those commands record the recipient response, not a change to the
        elder care record.
      x-family-response-schema:
        type: array
        items:
          $ref: '#/components/schemas/FamilyCredentialView'
  /visits:
    get:
      tags:
        - Visits
      summary: List visits
      x-status: draft
      description: >-
        Role-scoped: manager can filter freely, caregiver sees only their own, family and elder see
        only bound elders'. Also serves UC-CG06 (historical records) with a past `dateTo`.



        Family behaviour: query visits only for currently bound, authorised elders; an explicitly
        inaccessible elderId or unrelated caregiverId is 403. An omitted elderId includes all
        currently accessible elders. Provide dateFrom and dateTo together, or omit both to use the
        current Monday-to-Sunday week in Asia/Singapore. Dates are inclusive local dates: filter
        scheduledStart from dateFrom 00:00 up to but excluding the day after dateTo 00:00. A reversed
        range or one missing date is 400 for FAMILY. Sort by scheduledStart ascending then id
        ascending, paginate after filtering, and return 200 with items=[] for no visits. Null
        caregiverId means not assigned. Other roles keep their existing date-filter behaviour.


        Family callers are identified from the authenticated session, never a caller-supplied
        familyMemberId. For family callers, care resources require an ACTIVE binding to their actual
        elder, with no revocation and no elapsed expiresAt, and the applicable access scope at request
        time. Revocation/expiry takes effect on subsequent reads and writes, including historical
        content. Reading a family care resource records the caller, resource and server access time in
        the internal audit trail. Read access alone does not imply explicit acknowledgement.
        FULL/READ_ONLY do not imply different clinical field sets: both may use the family read
        projections below; an authorised notification recipient may record read/view/acknowledgement
        under either scope because those commands record the recipient response, not a change to the
        elder care record.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: elderId
          in: query
          schema:
            type: integer
            format: int64
        - name: caregiverId
          in: query
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VisitStatus'
      responses:
        '200':
          description: >-
            Family response uses the explicitly listed family schema. Other roles retain the original
            response schema; the server chooses by authenticated role, never by a client projection
            flag.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FamilyVisitPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Visit'
                      page:
                        type: integer
                      size:
                        type: integer
                      totalElements:
                        type: integer
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM02
        - UC-FM03
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: listVisits
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyVisitPage'
  /visits/{visitId}:
    parameters:
      - $ref: '#/components/parameters/VisitId'
    get:
      tags:
        - Visits
      summary: Get a visit
      x-status: draft
      description: >-
        UC-FM03 (live status) reads this directly, typically polled.


        Read the authorised family live view. asOf is the server snapshot time, not a fabricated visit
        event. The current page may poll approximately every 15 seconds while visible and stop when
        hidden or closed; back off after failures and label retained data stale. Never infer an actual
        state change from the clock. Stop displaying protected content after 401/403. Tasks are read
        through GET /visits/{visitId}/tasks. No WebSocket or push infrastructure is required.
        Non-family readers retain the existing Visit response.


        Family callers are identified from the authenticated session, never a caller-supplied
        familyMemberId. For family callers, care resources require an ACTIVE binding to their actual
        elder, with no revocation and no elapsed expiresAt, and the applicable access scope at request
        time. Revocation/expiry takes effect on subsequent reads and writes, including historical
        content. Reading a family care resource records the caller, resource and server access time in
        the internal audit trail. Read access alone does not imply explicit acknowledgement.
        FULL/READ_ONLY do not imply different clinical field sets: both may use the family read
        projections below; an authorised notification recipient may record read/view/acknowledgement
        under either scope because those commands record the recipient response, not a change to the
        elder care record.
      responses:
        '200':
          description: >-
            Family response uses the explicitly listed family schema. Other roles retain the original
            response schema; the server chooses by authenticated role, never by a client projection
            flag.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FamilyVisitView'
                  - $ref: '#/components/schemas/Visit'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM03
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: getVisit
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyVisitView'
  /visits/{visitId}/timeline:
    parameters:
      - $ref: '#/components/parameters/VisitId'
    get:
      tags:
        - Visits
      summary: Full state-transition history
      x-status: draft
      description: >-
        Includes transitions the state machine refused, not only the ones it applied — the
        auditability trail for this visit.


        For FAMILY return only APPLIED service transitions in occurredAt ascending, then id ascending
        order. Exclude refused attempts, rejection reasons and internal actor IDs from the family
        response. A valid visit without applied transitions returns []. The internal audit history
        keeps both APPLIED and REJECTED; filtering the family response does not delete evidence or
        change existing authorised audit views.


        Family callers are identified from the authenticated session, never a caller-supplied
        familyMemberId. For family callers, care resources require an ACTIVE binding to their actual
        elder, with no revocation and no elapsed expiresAt, and the applicable access scope at request
        time. Revocation/expiry takes effect on subsequent reads and writes, including historical
        content. Reading a family care resource records the caller, resource and server access time in
        the internal audit trail. Read access alone does not imply explicit acknowledgement.
        FULL/READ_ONLY do not imply different clinical field sets: both may use the family read
        projections below; an authorised notification recipient may record read/view/acknowledgement
        under either scope because those commands record the recipient response, not a change to the
        elder care record.
      responses:
        '200':
          description: >-
            Family response uses the explicitly listed family schema. Other roles retain the original
            response schema; the server chooses by authenticated role, never by a client projection
            flag.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/FamilyVisitTimelineEntry'
                  - type: array
                    items:
                      $ref: '#/components/schemas/VisitStateTransition'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
        '404':
          $ref: '#/components/responses/FamilyNotFound'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM03
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: getVisitTimeline
      x-family-response-schema:
        type: array
        items:
          $ref: '#/components/schemas/FamilyVisitTimelineEntry'
  /visits/{visitId}/tasks:
    parameters:
      - $ref: '#/components/parameters/VisitId'
    get:
      tags:
      - Visits
      summary: List visit tasks for the current role
      x-status: draft
      description: >-
        UC-CG03. Lists the task-execution state for the caller's assigned visit. Task completion remains available
        through the task-specific completion route.


        Family behaviour (UC-FM03): Read family-visible task progress for an authorised visit, ordered by task id.
        Task definitions come from the plan owner and actual execution outcomes from the visit owner. Return []
        when the existing visit has no tasks. Only DONE counts as completed; SKIPPED and REFUSED remain distinct.
        This endpoint never changes task or visit state.


        Family callers are identified from the authenticated session, never a caller-supplied familyMemberId. For
        family callers, care resources require an ACTIVE binding to their actual elder, with no revocation and no
        elapsed expiresAt, and the applicable access scope at request time. Revocation/expiry takes effect on
        subsequent reads and writes, including historical content. Reading a family care resource records the
        caller, resource and server access time in the internal audit trail. Read access alone does not imply
        explicit acknowledgement. FULL/READ_ONLY do not imply different clinical field sets: both may use the
        family read projections below; an authorised notification recipient may record read/view/acknowledgement
        under either scope because those commands record the recipient response, not a change to the elder care
        record.


        The server selects the response by the authenticated role. The family projection excludes internal
        caregiver notes and unclassified outcomes; callers cannot request another role's projection. Family errors
        use FamilyProblemDetail within the existing shared problem response shape.
      responses:
        '200':
          description: >-
            Visit tasks. Family callers receive FamilyVisitTaskView items; caregivers retain VisitTask items. The
            server selects by authenticated role.
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/FamilyVisitTaskView'
                - type: array
                  items:
                    $ref: '#/components/schemas/VisitTask'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-contract-status: specified
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
      - sessionCookie: []
      x-family-response-schema:
        type: array
        items:
          $ref: '#/components/schemas/FamilyVisitTaskView'
      x-family-use-cases:
      - UC-FM03
      operationId: getVisitTasks
  /reports:
    get:
      tags:
        - Reports
      summary: List generated reports
      x-status: draft
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: elderId
          in: query
          schema:
            type: integer
            format: int64
        - name: audience
          in: query
          schema:
            $ref: '#/components/schemas/ReportAudience'
      responses:
        '200':
          description: >-
            Family response uses the explicitly listed family schema. Other roles retain the original
            response schema; the server chooses by authenticated role, never by a client projection
            flag.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FamilyReportPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Report'
                      page:
                        type: integer
                      size:
                        type: integer
                      totalElements:
                        type: integer
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          $ref: '#/components/responses/FamilyUnauthorized'
        '403':
          $ref: '#/components/responses/FamilyForbidden'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM04
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: listReports
      description: >-
        Family access is limited to FAMILY reports of elders currently in scope, in PUBLISHED or
        ARCHIVED state. DRAFT and non-FAMILY reports are forbidden. Apply the same
        current-authorisation and content rules on list, online detail, weekly summary and PDF export.
        Generation-time permission is not permanent reading permission. Family content uses caregiver
        names only, no staff-performance data, vital ranges rather than raw measurements, no other
        elders, and a fixed medical disclaimer. Redact any unsafe legacy content at read/export
        without mutating the archived original. All report generation and amendments remain with MG07.
        For FAMILY, omitted audience means FAMILY; explicitly requesting REGULATOR or INTERNAL is 403.
        An omitted elderId spans currently accessible elders only. Order by periodStart descending,
        createdAt descending, then id descending and paginate after filtering; no reports returns 200
        with items=[]. Other roles retain their existing report-list schema and audience rules.


        Family callers are identified from the authenticated session, never a caller-supplied
        familyMemberId. For family callers, care resources require an ACTIVE binding to their actual
        elder, with no revocation and no elapsed expiresAt, and the applicable access scope at request
        time. Revocation/expiry takes effect on subsequent reads and writes, including historical
        content. Reading a family care resource records the caller, resource and server access time in
        the internal audit trail. Read access alone does not imply explicit acknowledgement.
        FULL/READ_ONLY do not imply different clinical field sets: both may use the family read
        projections below; an authorised notification recipient may record read/view/acknowledgement
        under either scope because those commands record the recipient response, not a change to the
        elder care record.
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyReportPage'
  /reports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Reports
      summary: Read a report online
      x-status: draft
      description: >-
        The report's sections, already filtered for its audience. Readable even when PDF export fails
        (5b). A family member can only read `FAMILY` reports of elders they are bound to. There is
        deliberately no DELETE and no PUT on a report: an archived report cannot be removed or edited
        in place (5a); corrections are appended as amendments.



