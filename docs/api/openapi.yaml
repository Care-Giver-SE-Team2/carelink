openapi: 3.0.3

info:
  title: CareLink API
  version: 0.0.1
  description: >-
    Caregiver slice 1 is implemented for GET /caregivers/me, GET /caregivers/me/schedule,
    and GET /visits/{visitId}/work-pack; these definitions supersede the matching draft operations.
    Includes the existing Auth contract and the specified FM01-FM05 family contracts. Family
    operations remain x-status: draft until implemented; inclusion in Final does not imply a working
    backend. Shared paths retain their non-family response alternatives. The family owner supplies
    only the family use-case behaviour; other use cases, binding management and platform
    implementation are outside this change.
  license:
    name: UNLICENSED

servers:
  - url: /api
    description: Same-origin, relative to whichever host serves the front end.

tags:
  - name: Auth
    description: Session-based sign-in and identity.

  - name: Elders
    description: Elder profiles visible to the current role.

  - name: Intake
    description: Intake applications and application progress, scoped to the current role.
  - name: Caregivers
    description: Caregiver profiles and credentials, scoped to the current role.
  - name: Visits
    description: Visit schedules, status, tasks and service timelines, scoped to the current role.
  - name: Incidents
    description: Incident details, view receipts and acknowledgement, with access defined per operation.
  - name: Reports
    description: Reports, weekly summaries and optional PDF export, scoped to the current role.
  - name: Notifications
    description: The current user's notification inbox and notification read state.

paths:
  /caregivers/me:
    get:
      tags: [Caregivers]
      operationId: getCurrentCaregiver
      summary: Read the caregiver profile linked to the session account
      x-status: implemented
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Current caregiver profile; no caller-supplied caregiver id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverSelfProfile'}
        '401': {description: No authenticated session.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /caregivers/me/schedule:
    get:
      tags: [Caregivers]
      operationId: getCurrentCaregiverSchedule
      summary: Assigned visits and credential expiry reminders
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        CAREGIVER only. Uses visit.caregiver_id (current assignment), not assignment history.
        Ordered by scheduledStart then id. Dates are inclusive Singapore calendar dates.
        Omit both for Singapore today through today+6; otherwise supply both, at most 31 days.
        Empty dates return an empty upcomingVisits array. Reminders are based on Singapore today,
        not the selected date range; default expiry warning horizon is 30 days.
        Reminders are ordered by expiryDate then id, independently of family credential ordering.
      parameters:
        - name: dateFrom
          in: query
          schema: {type: string, format: date}
        - name: dateTo
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          description: Schedule for the session caregiver.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverSchedule'}
        '400': {description: Invalid, partial, reversed or over-31-day date range.}
        '401': {description: No authenticated session.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /visits/{visitId}/work-pack:
    get:
      tags: [Visits]
      operationId: getAssignedVisitWorkPack
      summary: Read-only work pack for the currently assigned caregiver
      x-status: implemented
      security: [{sessionCookie: []}]
      description: >-
        CAREGIVER only and visit.caregiver_id must equal the session caregiver profile id.
        Reads exactly visit.care_plan_id, including a superseded published version, never the
        elder's latest plan. Required evidence comes only from the assigned visit/task plan
        nodes and excludes NONE. Elder medicalNotes and family details are not exposed.
        Access/emergency notes are null until dedicated safe fields exist. Successful,
        missing and denied visit reads are audited independently of the read transaction.
        Local date-times in this read model are Singapore wall-clock values without an offset.
      parameters:
        - name: visitId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Read-only assigned work pack.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaregiverWorkPack'}
        '400': {description: Invalid visit id format.}
        '401': {description: No authenticated session.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Visit references an unpublished/wrong-elder plan or nodes outside the bound plan.}

  /auth/csrf:
    get:
      tags: [Auth]
      summary: Initialise browser CSRF protection
      x-status: implemented
      description: >-
        Call before login to obtain the XSRF-TOKEN cookie. Send that cookie and echo its value in
        the X-XSRF-TOKEN header for login and subsequent state-changing requests. This endpoint
        does not authenticate the caller.
      security: []
      responses:
        '200':
          description: CSRF token initialised; no response body.
          headers:
            Set-Cookie:
              description: XSRF-TOKEN cookie readable by the browser application.
              schema:
                type: string

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: >
        Starts a server-side session on success. The session is carried by an
        HttpOnly `JSESSIONID` cookie set on the response; the front end does
        not read or manage it directly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie (`JSESSIONID`) and CSRF cookie (`XSRF-TOKEN`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: >
            Invalid username or password. The two cases are not distinguished,
            so this response cannot be used to enumerate accounts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /elders:
    get:
      tags: [Elders]
      summary: List elders
      operationId: listElders
      x-status: implemented
      x-family-use-cases: [UC-FM02]
      security:
        - sessionCookie: []
      description: >-
        MANAGER callers receive every elder. FAMILY callers receive only elders linked to their
        current family profile by an ACTIVE binding with FULL or READ_ONLY access. The family
        account must currently be enabled and hold FAMILY. A binding is readable when expiresAt
        is absent or strictly later than the current time in Asia/Singapore; pending, rejected,
        revoked and expired bindings grant no access. Authorization is checked on every request.

        Both roles receive the same array of elder summaries. A family member with no readable
        elders receives 200 with an empty array. This operation has no pagination, search or sector
        filters. Identity comes from the authenticated session; no family ID or role parameter is
        accepted. This read-only GET requires no CSRF header.

        Validated requests reaching the FAMILY application query persist a READ record with
        the actor app_user ID (when resolvable), resource and outcome: OK, including empty
        results; DENIED for access refusal; or FAILED for lookup/query errors. Records
        commit independently with server occurred_at in Asia/Singapore. Authentication 401,
        method-role rejection 403 and MVC validation/conversion 400 rejected before the
        FAMILY application query are outside this audit. Existing request logging is
        unchanged. Audit storage failure returns 503 without protected data. Records
        exclude response bodies, raw query strings, exception details and secrets. Reading
        does not acknowledge notifications or incidents. The resource is ELDER with a null
        collection ID. MANAGER reads retain their existing behavior and are outside this
        family audit.
      responses:
        '200':
          description: Elder summaries visible to the current caller; an empty result is an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElderListItemResponse'
              examples:
                elders:
                  summary: Two readable elders, with and without a care plan
                  value:
                    - id: 101
                      fullName: Tan Mei
                      dateOfBirth: '1946-05-12'
                      address: 12 Example Road
                      sector: Central
                      planStatus: published
                      planVersion: 2
                      nextVisitDate: '2026-09-24'
                    - id: 102
                      fullName: Lim Wei
                      dateOfBirth: null
                      address: null
                      sector: null
                      planStatus: none
                      planVersion: null
                      nextVisitDate: null
                empty:
                  summary: No readable elders
                  value: []
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          description: >-
            The caller lacks a permitted role, or the family account is disabled, no longer
            holds FAMILY or has no family profile.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # Member 4: FM01-FM05 contracts; x-status records each operation's implementation status.
        '503':
          $ref: '#/components/responses/FamilyAuditUnavailable'
  /intake-applications:
    post:
      tags:
        - Intake
      summary: Submit an intake application
      x-status: implemented
      description: >-
        Submit an intake application as the current family member. Trim required text and reject
        blanks. Omitted mobilityLevel uses INDEPENDENT. Success creates only the application in
        SUBMITTED and returns 201; it does not create an elder, care plan or binding. Approval belongs
        to MG01. The initial contract does not promise request-level idempotency: after an ambiguous
        network failure, query the caller's applications before explicitly resubmitting rather than
        automatically retrying the POST.


        Family identity is resolved from the session. No existing elder or active binding is required
        to submit or read the caller's own intake application. Family reads/writes are restricted to
        that applicant.


        State-changing calls require the existing session cookie and the current XSRF-TOKEN cookie
        value in the X-XSRF-TOKEN header. Missing/invalid CSRF protection is 403. No caller-supplied
        user ID or timestamp is accepted.
        New application creation times are generated in UTC and returned with an explicit timezone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyIntakeApplicationCreateRequest'
      responses:
        '201':
          description: Successful family operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyIntakeApplication'
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          description: >-
            Missing/invalid CSRF protection or insufficient family access. Shared security may
            reject the request before MVC runs; a ProblemDetail body is not guaranteed.
            Clients must handle the HTTP status even when no JSON body is returned.
      x-contract-status: specified
      x-use-cases:
        - UC-FM01
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: familyPostIntakeApplications
      parameters:
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Echo the current XSRF-TOKEN cookie; use the platform session/CSRF bootstrap flow.
          schema:
            type: string
            minLength: 1
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIntakeApplication'
    get:
      tags:
        - Intake
      summary: List intake applications
      x-status: draft
      x-family-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IntakeStatus'
      responses:
        '200':
          description: >-
            The implemented family list uses FamilyIntakeApplicationPage. The original response
            schema is retained for the manager review list, whose implementation is pending.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FamilyIntakeApplicationPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/IntakeApplication'
                      page:
                        type: integer
                      size:
                        type: integer
                      totalElements:
                        type: integer
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          $ref: '#/components/responses/FamilyForbidden'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM01
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: listIntakeApplications
      description: >-
        Family callers see only applications they submitted, including review status and
        family-visible remarks. Order by createdAt descending, then id descending. Empty results and
        pages beyond the last page return 200 with items=[]. Filter by applicant and optional status
        before pagination and totalElements counting. Page defaults to 0; size defaults to 20 and
        accepts 1 through 200. Invalid pagination or status values return 400.


        Family identity is resolved from the session. The account must currently be enabled, hold
        FAMILY and have a family profile. No existing elder or active binding is required. A family
        account with additional roles still receives only its own applications. This read-only GET
        requires a valid session but no CSRF header. The manager review-list contract is retained;
        its implementation is pending and non-FAMILY callers currently receive 403.
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIntakeApplicationPage'
  /intake-applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Intake
      summary: Get an intake application
      x-status: draft
      x-family-status: implemented
      responses:
        '200':
          description: >-
            The implemented family detail view uses FamilyIntakeApplication. The original response
            schema is retained for the manager detail view, whose implementation is pending.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FamilyIntakeApplication'
                  - $ref: '#/components/schemas/IntakeApplication'
        '400':
          $ref: '#/components/responses/FamilyValidationError'
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          $ref: '#/components/responses/FamilyForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM01
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: getIntakeApplication
      description: >-
        Read the current family member's application and its review progress in any of the four
        application statuses. Another applicant's ID returns 403; a nonexistent application returns
        404. The path ID must fit a signed 64-bit integer; malformed or overflowing values return 400.
        The response elderId is null until approval links a formal elder. An approved application is
        not an active binding. Reading the application does not change its status or review fields.


        Family identity is resolved from the session. The account must currently be enabled, hold
        FAMILY and have a family profile. No existing elder or active binding is required. A family
        account with additional roles still reads only its own applications. This read-only GET
        requires a valid session but no CSRF header. The manager detail contract is retained;
        its implementation is pending and non-FAMILY callers currently receive 403.
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyIntakeApplication'
  /caregivers/{caregiverId}:
    parameters:
      - $ref: '#/components/parameters/CaregiverId'
    get:
      tags:
        - Caregivers
      summary: Get a caregiver profile
      x-status: draft
      x-family-status: implemented
      responses:
        '200':
          description: >-
            The implemented FAMILY response contains only FamilyCaregiverView fields. The
            original Caregiver response is retained for other roles, whose implementation is
            pending. The server selects the projection from the authenticated role.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/FamilyCaregiverView'
                  - $ref: '#/components/schemas/Caregiver'
              examples:
                familyProfile:
                  summary: Public profile of a caregiver with an authorized visit relationship
                  value:
                    id: 201
                    fullName: Lim Jia Hui
                    dialects:
                      - Mandarin
                      - Hokkien
                noDialects:
                  summary: Public profile with no recorded dialects
                  value:
                    id: 202
                    fullName: Daniel Goh
                    dialects: []
        '400':
          description: The caregiverId path value is not a signed 64-bit integer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          description: >-
            The caller lacks FAMILY, the current family account/profile is unavailable, or
            caregiverId has no visit relationship to a currently readable elder. This includes
            unrelated and nonexistent integer IDs, including zero and negative IDs. The
            relationship check precedes the profile lookup.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: >-
            The caregiver profile cannot be found after the family's visit relationship has
            passed authorization. An ID without an authorized relationship returns 403 first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          $ref: '#/components/responses/FamilyAuditUnavailable'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM02
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: getCaregiver
      description: >-
        The implemented FAMILY detail reads the public profile of a caregiver assigned to a
        current or historical visit of an elder the caller can currently access. The visit's
        caregiverId must match; a visit_assignment replacement-history row alone grants no
        access. This relationship is independent of the selected schedule week or visit status.
        Historical visits remain eligible only while the elder binding remains readable.

        Identity comes from the authenticated session; the account must currently be enabled,
        hold FAMILY and have a family profile. Each request checks ACTIVE, unexpired bindings
        with FULL or READ_ONLY scope. Expiry is evaluated in Asia/Singapore and access ends
        exactly at expiresAt. Revocation or expiry takes effect on subsequent requests. The
        client cannot select a family identity or response projection. This read-only GET
        requires a valid session but no CSRF header.

        Example: GET /api/caregivers/201. The path value must fit a signed 64-bit integer;
        malformed or overflowing values return 400. Authorization runs before the profile
        lookup: no eligible visit relationship returns 403, including an unrelated or
        nonexistent ID. Only a missing profile after successful authorization returns 404.

        The response contains only id, fullName and dialects. Stored comma-separated dialects
        become an array: trim each item and omit empty items while preserving order, spelling
        and duplicates. Null or blank source values become []. No phone, user/account ID,
        sector, internal status, performance or credential details are returned. An inactive
        caregiver's public profile remains readable through an eligible historical visit.

        Other-role profile contracts remain planned and their original response schema is
        retained. Their implementation is pending; non-FAMILY callers currently receive 403.

        Validated requests reaching the FAMILY application query persist a READ record with
        the actor app_user ID (when resolvable), resource and outcome: OK, including empty
        results; DENIED for access refusal; or FAILED for lookup/query errors. Records
        commit independently with server occurred_at in Asia/Singapore. Authentication 401,
        method-role rejection 403 and MVC validation/conversion 400 rejected before the
        FAMILY application query are outside this audit. Existing request logging is
        unchanged. Audit storage failure returns 503 without protected data. Records
        exclude response bodies, raw query strings, exception details and secrets. Reading
        does not acknowledge notifications or incidents. The resource is CAREGIVER,
        identified by the requested caregiverId.
      x-family-response-schema:
        $ref: '#/components/schemas/FamilyCaregiverView'
  /caregivers/{caregiverId}/credentials:
    parameters:
      - $ref: '#/components/parameters/CaregiverId'
    get:
      tags:
        - Caregivers
      summary: List a caregiver's certifications
      x-status: draft
      x-family-status: implemented
      responses:
        '200':
          description: >-
            The implemented FAMILY response is an array of FamilyCredentialView, ordered by
            credentialTypeId then id. An authorized caregiver with no public credentials returns
            []. The original Credential array is retained for other roles, whose implementation
            is pending. The server selects the projection from the authenticated role.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/FamilyCredentialView'
                  - type: array
                    items:
                      $ref: '#/components/schemas/Credential'
              examples:
                publicCredentials:
                  summary: Public credentials evaluated on 2026-09-28 in Asia/Singapore
                  value:
                    - id: 501
                      caregiverId: 201
                      credentialTypeId: 11
                      credentialTypeName: Basic Care Skills
                      issuingBody: Example Training Centre
                      validFrom: '2026-01-01'
                      expiryDate: '2027-01-01'
                      status: PUBLISHED
                    - id: 502
                      caregiverId: 201
                      credentialTypeId: 12
                      credentialTypeName: First Aid
                      issuingBody: Example Training Centre
                      validFrom: '2025-10-01'
                      expiryDate: '2026-09-28'
                      status: EXPIRING
                    - id: 503
                      caregiverId: 201
                      credentialTypeId: 13
                      credentialTypeName: Safe Transfer
                      issuingBody: null
                      validFrom: '2025-01-01'
                      expiryDate: '2026-09-27'
                      status: EXPIRED
                    - id: 504
                      caregiverId: 201
                      credentialTypeId: 14
                      credentialTypeName: Medication Assistance
                      issuingBody: Example Training Centre
                      validFrom: '2026-01-01'
                      expiryDate: '2027-01-01'
                      status: REVOKED
                    - id: 505
                      caregiverId: 201
                      credentialTypeId: 15
                      credentialTypeName: Dementia Care
                      issuingBody: Example Training Centre
                      validFrom: '2026-10-01'
                      expiryDate: '2027-10-01'
                      status: PUBLISHED
                    - id: 506
                      caregiverId: 201
                      credentialTypeId: 16
                      credentialTypeName: Care Orientation
                      issuingBody: null
                      validFrom: null
                      expiryDate: '9999-12-31'
                      status: PUBLISHED
                noPublicCredentials:
                  summary: Authorized caregiver with no publicly visible credentials
                  value: []
        '400':
          description: The caregiverId path value is not a signed 64-bit integer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: >-
            No valid authenticated session. Shared security determines the response body;
            clients must handle the HTTP status without requiring a JSON body.
        '403':
          description: >-
            The caller lacks FAMILY, the current family account/profile is unavailable, or
            caregiverId has no visit relationship to a currently readable elder. This includes
            unrelated and nonexistent integer IDs, including zero and negative IDs. The
            relationship check precedes the caregiver and credential lookups.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: >-
            The caregiver profile cannot be found after the family's visit relationship has
            passed authorization. An ID without an authorized relationship returns 403 first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          $ref: '#/components/responses/FamilyAuditUnavailable'
      x-contract-status: specified
      x-family-use-cases:
        - UC-FM02
      x-family-owner: Member 4 (FM01-FM05 behaviour); source data remains with its assigned owner.
      security:
        - sessionCookie: []
      operationId: listCaregiverCredentials
      description: >-
        The implemented FAMILY query returns public credentials for a caregiver assigned to a
        current or historical visit of an elder the caller can currently access. The visit's
        caregiverId must match; a visit_assignment replacement-history row alone grants no
        access. This relationship is independent of the selected schedule week or visit status.
        An inactive caregiver remains readable through an eligible visit relationship.

        Identity comes from the authenticated session; the account must currently be enabled,
        hold FAMILY and have a family profile. Each request checks ACTIVE, unexpired bindings
        with FULL or READ_ONLY scope. Binding expiry is evaluated in Asia/Singapore and access
        ends exactly at expiresAt. Revocation or expiry takes effect on subsequent requests.
        This read-only GET requires a valid session but no CSRF header. Example:
        GET /api/caregivers/201/credentials. The path value must fit a signed 64-bit integer;
        malformed or overflowing values return 400. Missing or unrelated integer IDs return
        403 before resource lookup; only a missing caregiver after authorization returns 404.

        Include stored PUBLISHED, EXPIRING, EXPIRED and REVOKED credentials; exclude SUBMITTED
        and REJECTED. Return the credential type name from the type catalogue, with ordering
        by credentialTypeId then id. The eight family fields exclude certificate numbers,
        reviewers, renewal links and internal timestamps. issuingBody and validFrom may be
        null, but their keys remain present. No public credentials returns 200 with [].

        Evaluate dates once per request using the server clock in Asia/Singapore. expiryDate
        includes the whole stated date: stored PUBLISHED or EXPIRING becomes EXPIRED in the
        response only when expiryDate is before today. Stored REVOKED and EXPIRED remain
        unchanged even when their dates are in the future. Preserve other public statuses;
        this query does not derive a 30-day EXPIRING threshold. expiryDate 9999-12-31 is the
        permanent sentinel and remains in the response, for display as no expiry. A future
        validFrom is retained with the public status; clients must show not yet effective,
        rather than treating PUBLISHED or EXPIRING alone as proof of current validity.

        Reading credentials does not update stored statuses, perform approval or run the
        expiry scan. Other-role
        contracts and their original response schema remain planned; non-FAMILY callers
        currently receive 403.

        Validated requests reaching the FAMILY application query persist a READ record with
        the actor app_user ID (when resolvable), resource and outcome: OK, including empty
        results; DENIED for access refusal; or FAILED for lookup/query errors. Records
