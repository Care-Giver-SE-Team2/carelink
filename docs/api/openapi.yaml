components:
  schemas:
    CaregiverSelfProfile:
      type: object
      required: [id, userId, fullName, status]
      properties:
        id: {type: integer, format: int64}
        userId: {type: integer, format: int64}
        fullName: {type: string}
        phone: {type: string, nullable: true}
        sector: {type: string, nullable: true}
        dialects: {type: string, nullable: true}
        status: {type: string, enum: [ONBOARDING, AVAILABLE, BUSY, INACTIVE]}
    CaregiverAssignedVisit:
      type: object
      required: [id, elderId, elderName, scheduledStart, status, version]
      properties:
        id: {type: integer, format: int64}
        elderId: {type: integer, format: int64}
        elderName: {type: string}
        serviceType: {type: string, nullable: true}
        scheduledStart: {type: string, description: Singapore local date-time, example: '2026-09-24T09:00:00'}
        scheduledEnd: {type: string, nullable: true, description: Singapore local date-time}
        status: {type: string, enum: [SCHEDULED, ARRIVED, IN_PROGRESS, COMPLETED, VERIFIED, AUTO_CLOSED, EXCEPTION, CANCELLED]}
        version: {type: integer}
    CaregiverSchedule:
      type: object
      required: [dateFrom, dateTo, timeZone, upcomingVisits, certificationAlerts]
      properties:
        dateFrom: {type: string, format: date}
        dateTo: {type: string, format: date}
        timeZone: {type: string, enum: [Asia/Singapore]}
        upcomingVisits:
          type: array
          items: {$ref: '#/components/schemas/CaregiverAssignedVisit'}
        certificationAlerts:
          type: array
          items:
            type: object
            required: [id, name, expiryDate, status, warning]
            properties:
              id: {type: integer, format: int64}
              name: {type: string}
              certificateNo: {type: string, nullable: true}
              expiryDate: {type: string, format: date}
              status: {type: string, enum: [PUBLISHED, EXPIRING, EXPIRED]}
              warning: {type: string, enum: [EXPIRED, EXPIRING]}
    CaregiverWorkPack:
      type: object
      required: [visit, elder, carePlanId, carePlanVersion, serviceInstructions, tasks, requiredEvidenceKinds]
      properties:
        visit: {$ref: '#/components/schemas/CaregiverAssignedVisit'}
        elder:
          type: object
          required: [elderId, preferredName, languageNeeds]
          properties:
            elderId: {type: integer, format: int64}
            preferredName: {type: string}
            serviceAddress: {type: string, nullable: true}
            postalSector: {type: string, nullable: true}
            languageNeeds:
              type: array
              items: {type: string}
            accessNotes: {type: string, nullable: true}
            emergencyNotes: {type: string, nullable: true}
        carePlanId: {type: integer, format: int64, nullable: true}
        carePlanVersion: {type: integer, nullable: true}
        serviceInstructions:
          type: array
          description: Names/instructions of the plan nodes assigned to this visit, not the full care plan.
          items: {type: string}
        tasks:
          type: array
          items: {$ref: '#/components/schemas/CaregiverExecutionTask'}
        requiredEvidenceKinds:
          type: array
          uniqueItems: true
          items: {type: string, enum: [CHECKLIST, PHOTO, READING]}
    CaregiverExecutionTask:
      type: object
      required: [id, visitId, name, status]
      properties:
        id: {type: integer, format: int64}
        visitId: {type: integer, format: int64}
        carePlanNodeId: {type: integer, format: int64, nullable: true}
        name: {type: string}
        status: {type: string, enum: [PENDING, DONE, SKIPPED, REFUSED]}
        outcome: {type: string, nullable: true}
        caregiverNote: {type: string, nullable: true}
        completedAt: {type: string, nullable: true, description: Singapore local date-time}
    ElderListItemResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - fullName
        - dateOfBirth
        - address
        - sector
        - planStatus
        - planVersion
        - nextVisitDate
      properties:
        id:
          type: integer
          format: int64
          description: Elder profile ID.
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        planStatus:
          type: string
          enum: [published, draft, none]
          description: Latest care plan state; absent, superseded or stopped plans are shown as none.
        planVersion:
          type: integer
          nullable: true
          description: Latest plan version; null when planStatus is none.
        nextVisitDate:
          type: string
          format: date
          nullable: true
          description: >-
            Next date derived from the published care plan on or after today, or null if none.
            This value does not establish that a dated visit record or caregiver assignment exists.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    CurrentUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    # Family projections and referenced shared schemas.
    FamilyIntakeApplicationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        targetElderName:
          type: string
          maxLength: 100
          minLength: 1
          description: Trim leading/trailing whitespace and reject a blank value.
        targetElderAge:
          type: integer
          minimum: 0
        targetAddress:
          type: string
          maxLength: 255
          minLength: 1
          description: Trim leading/trailing whitespace and reject a blank value.
        postalCode:
          type: string
          maxLength: 10
          minLength: 1
          description: Trim leading/trailing whitespace and reject a blank value.
        mobilityLevel:
          $ref: '#/components/schemas/MobilityLevel'
        preferredDialects:
          type: string
          maxLength: 100
        careNeeds:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        medicalNotes:
          type: string
      description: >-
        Family submission only. Applicant identity, approval fields, status and elderId are set by the
        server, never by the caller.
      example:
        targetElderName: Tan Mei
        targetAddress: 12 Example Road
        postalCode: '123456'
        mobilityLevel: INDEPENDENT
        careNeeds:
          - BATHING
          - VITALS
      required:
        - targetElderName
        - targetAddress
        - postalCode
    MobilityLevel:
      type: string
      enum:
        - INDEPENDENT
        - ASSISTIVE_CANE
        - WHEELCHAIR_BEDBOUND
    FamilyIntakeApplication:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        applicantFamilyMemberId:
          type: integer
          format: int64
        targetElderName:
          type: string
        targetElderAge:
          type: integer
          nullable: true
        targetAddress:
          type: string
        postalCode:
          type: string
        mobilityLevel:
          $ref: '#/components/schemas/MobilityLevel'
        preferredDialects:
          type: string
          nullable: true
        careNeeds:
          type: array
          items:
            type: string
          description: An empty array when no requested tasks were supplied.
        medicalNotes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/IntakeStatus'
        reviewRemarks:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        elderId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >-
            Null until approval creates the formal elder record; this ID does not grant a family
            binding.
      required:
        - id
        - applicantFamilyMemberId
        - targetElderName
        - targetAddress
        - postalCode
        - status
        - createdAt
        - reviewedAt
        - reviewRemarks
        - elderId
    IntakeStatus:
      type: string
      enum:
        - SUBMITTED
        - UNDER_REVIEW
        - APPROVED
        - REJECTED
    FamilyProblemDetail:
      type: object
      required:
        - type
        - title
        - status
      description: >-
        Error contract for FM01-FM05. Optional code is a stable machine-readable reason; fields contains
        input validation messages.
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      additionalProperties: true
      example:
        type: about:blank
        title: Insufficient permission
        status: 403
        detail: The current family member cannot access this resource.
    FamilyIntakeApplicationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyIntakeApplication'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          format: int64
          minimum: 0
      required:
        - items
        - page
        - size
        - totalElements
