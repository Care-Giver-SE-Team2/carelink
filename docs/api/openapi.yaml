          $ref: '#/components/schemas/IncidentSeverity'
        status:
          $ref: '#/components/schemas/IncidentStatus'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        locationText:
          type: string
          nullable: true
        description:
          type: string
        respondBy:
          type: string
          format: date-time
          nullable: true
          description: Countdown deadline; past this, the scheduled job escalates automatically.
        reportedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    IncidentLogEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
        action:
          type: string
        detail:
          type: string
        occurredAt:
          type: string
          format: date-time
    IncidentAcknowledgement:
      type: object
      properties:
        id:
          type: integer
          format: int64
        incidentId:
          type: integer
          format: int64
        familyMemberId:
          type: integer
          format: int64
        viewedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        responseNote:
          type: string
          nullable: true
    FamilyIncidentAcknowledgeRequest:
      type: object
      additionalProperties: false
      properties:
        responseNote:
          type: string
          maxLength: 255
      description: >-
        Optional first-acknowledgement note. Caller identity and timestamps cannot be supplied. Repeated
        acknowledgements preserve the first note.
    FamilyNotificationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FamilyNotification'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          format: int64
          minimum: 0
      required:
        - items
        - page
        - size
        - totalElements
    FamilyNotification:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        elderId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >-
            Derived from the linked care resource. Null only for a notification about the account
            itself, never a bypass for unauthorised care content.
        eventType:
          type: string
        channel:
          type: string
          enum:
            - IN_APP
        title:
          type: string
          maxLength: 150
        body:
          type: string
          maxLength: 1000
          nullable: true
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        status:
          type: string
          enum:
            - SENT
            - READ
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
      description: >-
        A displayable in-app notification for the current user. SENT means available in the inbox, not
        email delivery. For an incident link, resourceType is incident and resourceId is the incident
        ID, not the notification ID.
      example:
        id: 901
        elderId: 12
        eventType: INCIDENT_RAISED
        channel: IN_APP
        title: An urgent care incident was reported
        body: Open the incident to view details and acknowledge.
        resourceType: incident
        resourceId: 77
        status: SENT
        createdAt: '2026-09-09T10:00:00+08:00'
        sentAt: '2026-09-09T10:00:00+08:00'
        readAt: null
      required:
        - id
        - elderId
        - eventType
        - channel
        - title
        - body
        - resourceType
        - resourceId
        - status
        - createdAt
        - sentAt
        - readAt
    Notification:
      type: object
      required:
        - id
        - eventType
        - channel
        - title
        - status
      properties:
        id:
          type: integer
          format: int64
        eventType:
          type: string
          example: INCIDENT_ESCALATED
        channel:
          type: string
          enum:
            - IN_APP
            - SMS
            - EMAIL
        title:
          type: string
        body:
          type: string
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum:
            - PENDING
            - SENT
            - READ
            - FAILED
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true

    VisitTask:
      type: object
      required:
      - id
      - visitId
      - name
      - status
      properties:
        id:
          type: integer
          format: int64
        visitId:
          type: integer
          format: int64
        carePlanNodeId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        status:
          $ref: '#/components/schemas/VisitTaskStatus'
        outcome:
          type: string
        caregiverNote:
          type: string
        completedAt:
          type: string
          format: date-time
          nullable: true
    VisitAssignmentHistoryItem:
      type: object
      properties:
        caregiverId:
          type: integer
          format: int64
        caregiverName:
          type: string
        status:
          type: string
        reason:
          type: string
          nullable: true
        assignedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CaregiverId:
      name: caregiverId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ElderId:
      name: elderId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    FamilyValidationError:
      description: >-
        Invalid input, date range, week start, unexpected request field, or unsupported family filter.
        Optional fields maps field names to validation messages.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'
    FamilyUnauthorized:
      description: No valid authenticated session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'
    FamilyForbidden:
      description: >-
        The current caller lacks the family role, resource ownership, recipient identity, or a
        currently active, unexpired binding/access scope. An authenticated caller does not gain access
        by changing an ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'
    NotFound:
      description: No resource with this id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    FamilyNotFound:
      description: >-
        The requested resource does not exist, or no readable report exists for the requested week.
        Empty collections use 200 with an empty array or page items array instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'
    FamilyServiceUnavailable:
      description: >-
        Report rendering is temporarily unavailable. The authorised online report remains readable;
        retrying export does not regenerate the report.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/FamilyProblemDetail'

    Forbidden:
      description: Authenticated, but not permitted to act on this resource (e.g. an elder outside the caller's scope).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >
        Server-side session established by `POST /auth/login`. State-changing requests must also echo
        the `XSRF-TOKEN` cookie value in an `X-XSRF-TOKEN` header.
