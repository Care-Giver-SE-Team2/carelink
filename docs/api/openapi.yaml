components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    CurrentUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    # Family projections and referenced shared schemas.
    FamilyIntakeApplicationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        targetElderName:
          type: string
          maxLength: 100
          minLength: 1
          description: Trim leading/trailing whitespace and reject a blank value.
        targetElderAge:
          type: integer
          minimum: 0
        targetAddress:
          type: string
          maxLength: 255
          minLength: 1
          description: Trim leading/trailing whitespace and reject a blank value.
        postalCode:
          type: string
          maxLength: 10
          minLength: 1
          description: Trim leading/trailing whitespace and reject a blank value.
        mobilityLevel:
          $ref: '#/components/schemas/MobilityLevel'
        preferredDialects:
          type: string
          maxLength: 100
        careNeeds:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        medicalNotes:
          type: string
      description: >-
        Family submission only. Applicant identity, approval fields, status and elderId are set by the
        server, never by the caller.
