openapi: 3.0.3

info:
  title: CareLink API
  version: 0.0.1
  license:
    name: UNLICENSED

servers:
  - url: /api
    description: Same-origin, relative to whichever host serves the front end.

tags:
  - name: Auth
    description: Session-based sign-in and identity.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: >
        Starts a server-side session on success. The session is carried by an
        HttpOnly `JSESSIONID` cookie set on the response; the front end does
        not read or manage it directly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie (`JSESSIONID`) and CSRF cookie (`XSRF-TOKEN`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: >
            Invalid username or password. The two cases are not distinguished,
            so this response cannot be used to enumerate accounts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    CurrentUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
