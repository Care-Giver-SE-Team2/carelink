name: Main Slow Stage

# 慢速阶段：合入主干时以及每夜跑。不受十分钟限制。
# 集成测试、依赖漏洞扫描（SCA）、镜像构建与发布都在这里。

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'        # UTC 18:00 = 新加坡时间 02:00
  workflow_dispatch:

env:
  JAVA_VERSION: '25'

jobs:
  integration-tests:
    name: Integration tests (Testcontainers + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run integration tests
        working-directory: backend
        run: ./mvnw -B -ntp verify -Pintegration

  dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # 不缓存 NVD 库的话，每次都要重新下载，非常慢。
      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/dc-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Run Dependency-Check
        if: env.NVD_API_KEY != ''
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: carelink
          path: ./backend
          format: HTML
          args: >
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --data ${{ github.workspace }}/dc-data

      - name: Upload SCA report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: reports/

  build-image:
    name: Build and publish image
    needs: [integration-tests, dependency-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR 只接受全小写的镜像名，而组织名 Care-Giver-SE-Team2 带大写
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # 默认的 docker 驱动不支持 GHA 缓存导出，必须换成 docker-container 驱动
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建一次，之后各环境晋级的都是这同一个镜像，绝不重建。
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
