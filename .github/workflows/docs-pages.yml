name: Publish API Docs

# Publishes the hand-written OpenAPI contract as a static Swagger UI site on
# GitHub Pages. This is docs only: it does not touch the running application,
# so a reader can browse the contract without the backend or a database.

on:
  push:
    branches: [main]
    paths:
      - 'docs/api/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/api

      - id: deployment
        uses: actions/deploy-pages@v4
