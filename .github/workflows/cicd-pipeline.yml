name: CareLink CI/CD Pipeline

# One pipeline, from commit through to a staging deployment and a dynamic security scan.
#
# Two design rules, both necessary:
#   1. Anything independent runs in parallel. `needs` expresses real dependencies and
#      quality gates only, never queueing. A long serial chain looks tidy; the cost is
#      developers waiting.
#   2. Anything dependent stays serial. Failing tests must not produce an image, and
#      without an image there is nothing to deploy.
#
# Triggers are deliberately different: a pull request runs the fast stage only, so
# feedback stays quick; a push to main runs the whole chain, since main is trunk -
# every merge is a candidate for staging. There is also a nightly sweep and a manual
# trigger.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'        # 18:00 UTC = 02:00 the next day, Singapore time
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'

jobs:

  # ═════════════════════════════════════════════════════════════════
  #  Stage 1 - Fast feedback    three jobs in parallel, target under ten minutes
  # ═════════════════════════════════════════════════════════════════

  backend:
    name: Backend build, unit tests, architecture tests, SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                  # Sonar needs full history to attribute code

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven                    # caching ~/.m2 is what keeps this inside ten minutes

      - name: Compile, unit test, ArchUnit, JaCoCo
        working-directory: backend
        run: ./mvnw -B -ntp verify

      # SAST shares this job with the build. Splitting it out would repeat the entire
      # build, a textbook case of parallelism that is actually slower.
      - name: SonarQube Cloud analysis and quality gate
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORG }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                  # scan the history, not just the working tree

      # Run the official image directly, avoiding the gitleaks Action licence requirement
      # that applies to organisation repositories
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --redact --verbose \
            --report-format=sarif --report-path=/repo/gitleaks.sarif

      - name: Upload scan report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7

  # ═════════════════════════════════════════════════════════════════
  #  Quality gate    passes only when all three are green. Branch protection needs
  #                  just this one required check.
  # ═════════════════════════════════════════════════════════════════

  quality-gate:
    name: Quality gate
    needs: [backend, frontend, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the gate outcome
        run: |
          {
            echo "### Fast stage passed"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Backend build, unit tests, architecture tests, SAST | ${{ needs.backend.result }} |"
            echo "| Frontend lint, unit tests, build | ${{ needs.frontend.result }} |"
            echo "| Secret scanning | ${{ needs.secret-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═════════════════════════════════════════════════════════════════
  #  Stage 2 - Deep verification    two jobs in parallel, no ten-minute budget.
  #  Skipped on pull requests so fast feedback does not turn into half an hour.
  # ═════════════════════════════════════════════════════════════════

  integration-tests:
    name: Integration tests (Testcontainers + MySQL)
    needs: quality-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run integration tests against a real database
        working-directory: backend
        run: ./mvnw -B -ntp verify -Pintegration

  dependency-scan:
    name: Dependency vulnerability scan (SCA)
    needs: quality-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write     # to publish SARIF to the Security tab
    steps:
      - uses: actions/checkout@v7

      # Trivy is used rather than OWASP Dependency-Check. Dependency-Check makes every
      # user rebuild the entire NVD corpus locally; measured here, that is 385,317
      # records at roughly 40 seconds per 2,000-record page - about four and a half
      # hours, and an NVD API key made no measurable difference. Trivy consumes a
      # vulnerability database that is aggregated and published upstream, so the same
      # question is answered in well under a minute.
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1              # a HIGH or CRITICAL finding fails the build
          ignore-unfixed: true      # no fix available means nothing to act on today
          format: sarif
          output: trivy-dependencies.sarif

      - name: Publish findings to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-dependencies.sarif
          category: trivy-dependencies

      - name: Upload scan report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-scan-report
          path: trivy-dependencies.sarif
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════
  #  Stage 3 - Delivery    build once; every environment then deploys this same image
  # ═════════════════════════════════════════════════════════════════

  build-image:
    name: Build and publish image
    needs: [integration-tests, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # GHCR accepts lowercase image names only, and the organisation name has capitals
      - name: Compute the image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # The default docker driver cannot export a GHA cache; the docker-container driver can
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scanning the image as well as the dependencies. The base image ships an OS
      # package set of its own, which a dependency scan never sees.
      - name: Scan the built image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 0              # reported, not blocking: base-image CVEs are
                                    # usually outside our control to fix immediately
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      - name: Publish image findings to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ═════════════════════════════════════════════════════════════════
  #  Stage 4 - Deployment and dynamic scanning
  #  Deploy, smoke test, DAST and teardown must share one job: the container stack
  #  lives only on this runner and would not survive a job boundary.
  # ═════════════════════════════════════════════════════════════════

  deploy-staging:
    name: Deploy to staging, smoke test, DAST
    needs: build-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # Deploy exactly the image this run just built, addressed by its commit SHA
      - name: Resolve the image to deploy
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "CARELINK_IMAGE=ghcr.io/$REPO:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "Deploying ghcr.io/$REPO:${{ github.sha }}"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack
        run: |
          docker compose pull backend
          docker compose up -d

      # Not using compose --wait: on failure it prints nothing, which leaves you blind
      - name: Smoke test
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "service is healthy"
              exit 0
            fi
            state=$(docker inspect -f '{{.State.Status}}' carelink-backend-1 2>/dev/null || echo missing)
            if [ "$state" = "exited" ]; then
              echo "the backend container has exited; not waiting further"
              break
            fi
            sleep 5
          done
          echo "the service did not become healthy in time"
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "::group::backend"; docker compose logs --no-color backend; echo "::endgroup::"
          echo "::group::db";      docker compose logs --no-color db;      echo "::endgroup::"
          docker compose ps -a

      # ZAP runs on the same docker network as the application and addresses it by
      # service name. localhost inside the ZAP container is not the host, which is the
      # single most common mistake here.
      - name: OWASP ZAP baseline scan (DAST)
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network carelink-net \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://backend:8080 -r zap-report.html -I

      - name: Upload ZAP report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline-report
          path: zap-out/

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ═════════════════════════════════════════════════════════════════
  #  Wrap-up - Summary    always runs, leaving one table on the run page
  # ═════════════════════════════════════════════════════════════════

  pipeline-summary:
    name: Pipeline summary
    needs:
      - backend
      - frontend
      - secret-scan
      - quality-gate
      - integration-tests
      - dependency-scan
      - build-image
      - deploy-staging
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise every stage
        run: |
          {
            echo "## CareLink pipeline result"
            echo ""
            echo "Commit ${{ github.sha }} - triggered by ${{ github.event_name }}"
            echo ""
            echo "| Stage | Job | Result |"
            echo "|---|---|---|"
            echo "| Fast feedback | Backend build, unit tests, architecture tests, SAST | ${{ needs.backend.result }} |"
            echo "| Fast feedback | Frontend lint, unit tests, build | ${{ needs.frontend.result }} |"
            echo "| Fast feedback | Secret scanning | ${{ needs.secret-scan.result }} |"
            echo "| Gate | Quality gate | ${{ needs.quality-gate.result }} |"
            echo "| Deep verification | Integration tests | ${{ needs.integration-tests.result }} |"
            echo "| Deep verification | Dependency vulnerability scan | ${{ needs.dependency-scan.result }} |"
            echo "| Delivery | Build and publish image | ${{ needs.build-image.result }} |"
            echo "| Deployment | Staging, smoke test, DAST | ${{ needs.deploy-staging.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if the fast stage did not pass
        if: needs.quality-gate.result != 'success'
        run: exit 1
