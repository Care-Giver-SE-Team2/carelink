name: CareLink CI/CD Pipeline

# 一条完整的流水线，从代码提交一路到预发布部署与动态安全扫描。
#
# 设计原则有两条，缺一不可：
#   1. 能并行的一律并行——needs 只用来表达真实的依赖与质量门禁，
#      不用来制造无谓的等待。长长的一条串行链看着整齐，代价是开发者干等。
#   2. 该串行的绝不并行——测试没过就不该产出镜像，镜像没有就无从部署。
#
# 触发方式刻意区分：PR 只跑快速阶段以保住反馈速度，
# 主干跑完整链条，另有每夜巡检与手动触发。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'        # UTC 18:00 = 新加坡时间次日 02:00
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'

jobs:

  # ═════════════════════════════════════════════════════════════════
  #  第一阶段 · 快速反馈    三个 job 并行，目标十分钟内给出结论
  # ═════════════════════════════════════════════════════════════════

  backend:
    name: 后端构建 · 单元测试 · 架构测试 · SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                  # Sonar 需要完整历史做代码归属

      - name: 准备 JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven                    # 缓存 ~/.m2，压进十分钟的关键

      - name: 编译 · 单元测试 · ArchUnit · JaCoCo
        working-directory: backend
        run: ./mvnw -B -ntp verify

      # SAST 与构建同在一个 job：拆开跑要把整个构建重做一遍，
      # 那是「看起来并行、实际更慢」的典型。
      - name: SonarQube Cloud 静态分析与质量门禁
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORG }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend:
    name: 前端检查 · 单元测试 · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 代码检查
        working-directory: frontend
        run: npm run lint

      - name: 单元测试与覆盖率
        working-directory: frontend
        run: npm run test:coverage

      - name: 构建
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                  # 要扫历史提交，不只是当前工作区

      # 用官方镜像跑，避开 gitleaks Action 对组织仓库的授权要求
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --redact --verbose \
            --report-format=sarif --report-path=/repo/gitleaks.sarif

      - name: 上传扫描报告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7

  # ═════════════════════════════════════════════════════════════════
  #  质量门禁    上面三条全绿才放行。分支保护只需勾选这一个检查项。
  # ═════════════════════════════════════════════════════════════════

  quality-gate:
    name: 质量门禁
    needs: [backend, frontend, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 记录门禁结论
        run: |
          {
            echo "### 快速阶段通过"
            echo ""
            echo "| 检查项 | 结果 |"
            echo "|---|---|"
            echo "| 后端构建 · 单元测试 · 架构测试 · SAST | ${{ needs.backend.result }} |"
            echo "| 前端检查 · 单元测试 · 构建 | ${{ needs.frontend.result }} |"
            echo "| 密钥扫描 | ${{ needs.secret-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═════════════════════════════════════════════════════════════════
  #  第二阶段 · 深度验证    两个 job 并行，不受十分钟约束
  #  PR 阶段跳过，以免把快速反馈拖成半小时。
  # ═════════════════════════════════════════════════════════════════

  integration-tests:
    name: 集成测试（Testcontainers + MySQL）
    needs: quality-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: 起真实数据库跑集成测试
        working-directory: backend
        run: ./mvnw -B -ntp verify -Pintegration

  dependency-check:
    name: 依赖漏洞扫描（SCA）
    needs: quality-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # 不缓存 NVD 库的话每次都要重新下载，非常慢
      - name: 缓存 NVD 漏洞库
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/dc-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: carelink
          path: ./backend
          format: HTML
          args: >
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --data ${{ github.workspace }}/dc-data

      - name: 上传扫描报告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════
  #  第三阶段 · 交付    构建一次，之后各环境部署的都是这同一个镜像
  # ═════════════════════════════════════════════════════════════════

  build-image:
    name: 构建并发布镜像
    needs: [integration-tests, dependency-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR 只接受全小写镜像名，而组织名带大写字母
      - name: 计算镜像名
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # 默认的 docker 驱动不支持 GHA 缓存导出，必须换成 docker-container 驱动
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═════════════════════════════════════════════════════════════════
  #  第四阶段 · 部署与动态扫描
  #  部署、冒烟、DAST、拆环境必须在同一个 job：
  #  容器栈只活在这台 runner 上，换个 job 就没了。
  # ═════════════════════════════════════════════════════════════════

  deploy-staging:
    name: 部署预发布 · 冒烟测试 · DAST
    needs: build-image
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # 部署的就是本次运行刚构建的那个镜像，用 commit SHA 精确定位
      - name: 确定要部署的镜像
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "CARELINK_IMAGE=ghcr.io/$REPO:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "将部署 ghcr.io/$REPO:${{ github.sha }}"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 起环境
        run: |
          docker compose pull backend
          docker compose up -d

      # 不用 compose --wait：它失败时什么都不打印，排查起来是瞎子
      - name: 冒烟测试
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "服务健康"
              exit 0
            fi
            state=$(docker inspect -f '{{.State.Status}}' carelink-backend-1 2>/dev/null || echo missing)
            if [ "$state" = "exited" ]; then
              echo "backend 容器已退出，不再等待"
              break
            fi
            sleep 5
          done
          echo "服务未能在限定时间内变为健康"
          exit 1

      - name: 失败时倒出容器日志
        if: failure()
        run: |
          echo "::group::backend"; docker compose logs --no-color backend; echo "::endgroup::"
          echo "::group::db";      docker compose logs --no-color db;      echo "::endgroup::"
          docker compose ps -a

      # ZAP 跑在与应用同一个 docker 网络里，用服务名访问。
      # 从 ZAP 容器里访问 localhost 是访问不到宿主机的，这是最常见的坑。
      - name: OWASP ZAP 基线扫描（DAST）
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network carelink-net \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://backend:8080 -r zap-report.html -I

      - name: 上传 ZAP 报告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline-report
          path: zap-out/

      - name: 拆环境
        if: always()
        run: docker compose down -v

  # ═════════════════════════════════════════════════════════════════
  #  收尾 · 汇总    无论前面结果如何都执行，在运行页面留下一张总表
  # ═════════════════════════════════════════════════════════════════

  pipeline-summary:
    name: 流水线汇总
    needs:
      - backend
      - frontend
      - secret-scan
      - quality-gate
      - integration-tests
      - dependency-check
      - build-image
      - deploy-staging
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总各阶段结果
        run: |
          {
            echo "## CareLink 流水线结果"
            echo ""
            echo "提交 ${{ github.sha }} · 触发方式 ${{ github.event_name }}"
            echo ""
            echo "| 阶段 | 作业 | 结果 |"
            echo "|---|---|---|"
            echo "| 快速反馈 | 后端构建 · 单元测试 · 架构测试 · SAST | ${{ needs.backend.result }} |"
            echo "| 快速反馈 | 前端检查 · 单元测试 · 构建 | ${{ needs.frontend.result }} |"
            echo "| 快速反馈 | 密钥扫描 | ${{ needs.secret-scan.result }} |"
            echo "| 门禁 | 质量门禁 | ${{ needs.quality-gate.result }} |"
            echo "| 深度验证 | 集成测试 | ${{ needs.integration-tests.result }} |"
            echo "| 深度验证 | 依赖漏洞扫描 | ${{ needs.dependency-check.result }} |"
            echo "| 交付 | 构建并发布镜像 | ${{ needs.build-image.result }} |"
            echo "| 部署 | 预发布 · 冒烟 · DAST | ${{ needs.deploy-staging.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 快速阶段未通过则整体失败
        if: needs.quality-gate.result != 'success'
        run: exit 1
