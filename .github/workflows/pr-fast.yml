name: PR Fast Stage

# 快速阶段：每次 push 到特性分支、每个 PR 都跑。目标十分钟以内。
# 这里只放「快」的东西：编译、单元测试、覆盖率、静态分析、密钥扫描。
# 集成测试与依赖漏洞扫描一律放慢速阶段，否则十分钟守不住。

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend build, unit test, coverage, SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # Sonar 需要完整历史做代码归属

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven            # 缓存 ~/.m2，这是压进十分钟的关键

      # 用仓库自带的 wrapper，保证本地与 CI 是同一个 Maven 版本
      - name: Compile, unit test, JaCoCo, ArchUnit
        working-directory: backend
        run: ./mvnw -B -ntp verify

      # SAST。和上一步合在同一个 job，避免为了跑 Sonar 把整个构建重做一遍。
      # sonar.qualitygate.wait=true 让门禁不过时构建直接失败，
      # 配合分支保护即可实现「质量门禁不过就不给合」。
      # SonarCloud 尚未配置时自动跳过，不会让流水线变红。
      - name: SAST - SonarQube Cloud quality gate
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORG }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit test with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: Secret scanning - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 要扫历史提交，不只是当前工作区

      # 用官方镜像跑，避开 gitleaks Action 对组织仓库的授权要求
      - name: Run gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --redact --verbose \
            --report-format=sarif --report-path=/repo/gitleaks.sarif

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7
