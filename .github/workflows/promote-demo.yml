name: Promote to Demo

# Promotes to the demonstration environment. What is promoted is the image the
# pipeline already built; it is only re-tagged, never rebuilt. If each environment
# rebuilt its own image, what you validated in staging would not be the same binary
# running in the demo.
#
# "A named approver who is not the author of the change" is enforced by the demo
# Environment's protection rules:
#   Settings > Environments > demo
#     - Required reviewers: pick the members
#     - Prevent self-review: on

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote (the commit SHA of the pipeline run that built it)'
        required: true

jobs:
  promote:
    name: Re-tag and publish as demo
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Show what is being promoted
        run: echo "Promoting ${{ inputs.image_tag }}"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the same artefact as demo
        run: |
          IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          docker pull  $IMAGE:${{ inputs.image_tag }}
          docker tag   $IMAGE:${{ inputs.image_tag }} $IMAGE:demo
          docker push  $IMAGE:demo
