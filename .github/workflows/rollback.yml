name: Rollback staging

# Moves the :staging tag back to an image the pipeline already built and verified,
# then waits for the staging VM to report it. Nothing is rebuilt: what comes back is
# byte-for-byte the version that was running before.
#
# Code only. A database migration that has already run stays applied (Flyway is
# forward-only). If the change being undone shipped a migration, follow the rollback
# with a forward-fixing V<n+1>__*.sql rather than editing history.
#
# Run it from Actions > Rollback staging > Run workflow. Find the commit to go back
# to on the Actions page (each successful pipeline run names its commit).

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full commit SHA of the version to go back to (its image must exist in GHCR)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    name: Move the staging tag and wait for the VM
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://${{ vars.STAGING_HOST }}
    timeout-minutes: 20
    env:
      BASE_URL: http://${{ vars.STAGING_HOST }}
      TARGET: ${{ inputs.commit }}
    steps:
      - name: Check the input
        run: |
          if ! echo "$TARGET" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Give the full 40-character commit SHA."; exit 1
          fi
          if [ -z "${{ vars.STAGING_HOST }}" ]; then
            echo "The repository variable STAGING_HOST is not set."; exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # imagetools re-points the tag at the existing manifest without pulling or
      # pushing any layers, so the rollback itself takes seconds.
      - name: Point :staging at the chosen image
        run: |
          IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create --tag "$IMAGE:staging" "$IMAGE:$TARGET"
          echo "staging -> $TARGET"

      - name: Wait for staging to run it
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 10 "$BASE_URL/actuator/info" 2>/dev/null | jq -r '.app.commit // empty' || true)
            if [ "$live" = "$TARGET" ]; then
              echo "staging is running $TARGET"
              exit 0
            fi
            echo "attempt $i/60: staging reports '${live:-nothing yet}'"
            sleep 10
          done
          echo "staging did not switch within 10 minutes. On the machine: journalctl -u carelink-update -n 30"
          exit 1

      - name: Smoke test
        run: |
          body=$(curl -fsS --max-time 10 "$BASE_URL/actuator/health")
          echo "$body"
          echo "$body" | grep -q '"status":"UP"'
